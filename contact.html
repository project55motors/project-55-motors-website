<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Contact – Project 55 Motors</title>
  <meta name="description" content="Project 55 Motors — carefully selected used cars prepared to a high standard in South Shropshire. View current stock and enquire online.">

  <!-- Canonical (clean route) -->
  <link rel="canonical" href="https://project55motors.co.uk/contact">

  <!-- Primary stylesheet -->
  <link rel="stylesheet" href="/styles.css?v=20260108d">

  <!-- Social previews -->
  <meta property="og:site_name" content="Project 55 Motors">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Contact – Project 55 Motors">
  <meta property="og:description" content="Project 55 Motors — carefully selected used cars prepared to a high standard in South Shropshire. View current stock and enquire online.">
  <meta property="og:url" content="https://project55motors.co.uk/contact">
  <meta property="og:image" content="https://project55motors.co.uk/assets/hero-banners/hero-banner-2048.jpg">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">

  <style>
    /* Suppress iOS image callout on hero banner (admin long-press shortcut) */
    .hero-banner{
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    /* Premium: on-page status banner (submission confirmation / error) */
    .form-status{
      width: min(760px, 92vw);
      margin: 14px auto 0;
      padding: 14px 16px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(15,23,42,0.92);
      color: #fff;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
      letter-spacing: .2px;
    }
    .form-status small{ display:block; color: rgba(255,255,255,0.82); margin-top: 6px; }
  </style>
</head>

<body>

  <!-- HERO: keep the existing structure that your styles.css targets -->
  <header class="hero-header">
    <picture class="hero-picture">
      <source type="image/webp"
              srcset="/assets/hero-banners/hero-banner-512.webp 512w,
                      /assets/hero-banners/hero-banner-768.webp 768w,
                      /assets/hero-banners/hero-banner-1024.webp 1024w,
                      /assets/hero-banners/hero-banner-1536.webp 1536w,
                      /assets/hero-banners/hero-banner-2048.webp 2048w,
                      /assets/hero-banners/hero-banner-5120x1440-master.webp 5120w"
              sizes="100vw">
      <img class="hero-banner"
           src="/assets/hero-banners/hero-banner-1024.jpg"
           srcset="/assets/hero-banners/hero-banner-512.jpg 512w,
                   /assets/hero-banners/hero-banner-768.jpg 768w,
                   /assets/hero-banners/hero-banner-1024.jpg 1024w,
                   /assets/hero-banners/hero-banner-1536.jpg 1536w,
                   /assets/hero-banners/hero-banner-2048.jpg 2048w"
           sizes="100vw"
           width="2048" height="576"
           alt="Project 55 Motors — Carefully Selected Used Cars"
           loading="eager" decoding="async" fetchpriority="high" draggable="false">
    </picture>
  </header>

  <!-- NAV: clean routes (Cloudflare should map these to .html) -->
  <nav class="main-nav">
    <div class="main-nav-inner">
      <a href="/">Home</a>
      <a href="/inventory">Current Stock</a>
      <a href="/about">About</a>
      <a href="/contact" class="active">Contact</a>
    </div>
  </nav>

  <main class="page-wrapper">
    <h1 class="page-title">Contact Us</h1>
    <p class="page-intro">
      If you’d like to arrange a viewing, discuss a vehicle or ask a question, please use the form below.
      We aim to respond within a few hours.
    </p>

    <div id="formStatus" class="form-status" role="status" aria-live="polite" hidden></div>

    <div class="contact-layout">
      <form action="https://formsubmit.co/4f494987fba30d06e09c30445899cf4c"
            method="POST"
            class="contact-form"
            id="contactForm">

        <!-- FormSubmit options -->
        <input type="hidden" name="_subject" value="New enquiry — Project 55 Motors">
        <input type="hidden" name="_template" value="table">
        <input type="hidden" name="_captcha" value="false">
        <!-- Use the physical file for reliability through redirect rules -->
        <input type="hidden" name="_next" value="https://project55motors.co.uk/contact.html?sent=1">

        <!-- Honeypot (spam trap) -->
        <input type="text" name="_honey" style="display:none" tabindex="-1" autocomplete="off">

        <label for="name">Your Name</label>
        <input id="name" type="text" name="name" required>

        <label for="email">Email Address</label>
        <input id="email" type="email" name="email" required>

        <label for="phone">Phone Number</label>
        <input id="phone" type="tel" name="phone">

        <label for="message">Your Message</label>
        <textarea id="message" name="message" required></textarea>

        <button id="submitBtn" type="submit" class="btn-primary">Send Message</button>
      </form>
    </div>
  </main>

  <footer>
    © 2025 Project 55 Motors – South Shropshire. All rights reserved.
  </footer>

  <!-- Staff login modal -->
  <div id="adminLoginModal" class="modal">
    <div class="modal-content">
      <span class="modal-close" onclick="closeAdminModal()">×</span>
      <h2>Staff Login</h2>

      <form onsubmit="submitAdminLogin(event)">
        <input id="adminUser" type="text" placeholder="Username" required>
        <input id="adminPass" type="password" placeholder="Password" required>
        <button type="submit" class="modal-login-btn">Log In</button>
      </form>

      <p id="admin-login-error" class="modal-error"></p>
    </div>
  </div>

  <script src="/site-config.js"></script>
  <script src="/site.js"></script>
  <script src="/admin-shortcut.js"></script>

  <script>
    (function(){
      const params = new URLSearchParams(window.location.search);
      const statusEl = document.getElementById("formStatus");
      const form = document.getElementById("contactForm");
      const submitBtn = document.getElementById("submitBtn");

      // Pre-fill from ?msg=
      const preMsg = params.get("msg");
      if (preMsg) {
        const msgField = document.getElementById("message");
        if (msgField) msgField.value = preMsg;
      }

      // Structured pre-fill from vehicle pages
      const vehicle = params.get("vehicle");
      const reg = params.get("reg");
      const sourceUrl = params.get("url");

      if (vehicle || reg || sourceUrl) {
        const msgField = document.getElementById("message");
        const headerLines = [];
        if (vehicle) headerLines.push("Vehicle: " + decodeURIComponent(vehicle));
        if (reg) headerLines.push("Registration: " + decodeURIComponent(reg));
        if (sourceUrl) headerLines.push("Link: " + decodeURIComponent(sourceUrl));
        const header = headerLines.join("\n");

        // Add hidden fields so the email contains structured context
        if (form) {
          const addHidden = (name, val) => {
            if (!val) return;
            if (form.querySelector("input[name='" + name + "']")) return;
            const i = document.createElement("input");
            i.type = "hidden"; i.name = name; i.value = val;
            form.appendChild(i);
          };
          addHidden("vehicle", vehicle);
          addHidden("registration", reg);
          addHidden("vehicle_link", sourceUrl);
        }

        if (msgField) {
          const existing = (msgField.value || "").trim();
          if (!existing || !existing.includes("Vehicle:")) {
            msgField.value = header + "\n\n" + existing;
          }
        }
      }

      // Success banner if redirected back with ?sent=1 (non-JS fallback path)
      if (params.get("sent") === "1" && statusEl) {
        statusEl.hidden = false;
        statusEl.textContent = "Thank you — your message has been sent. We’ll get back to you as soon as possible.";
      }

      // Premium: always show an on-page confirmation by submitting via FormSubmit AJAX.
      // This avoids inconsistent CAPTCHA / redirect behaviour.
      if (form && window.fetch) {
        form.addEventListener("submit", async function(e){
          e.preventDefault();

          if (statusEl) {
            statusEl.hidden = false;
            statusEl.textContent = "Sending…";
          }
          if (submitBtn) {
            submitBtn.disabled = true;
            submitBtn.textContent = "Sending…";
          }

          try {
            const fd = new FormData(form);
            const ajaxUrl = "https://formsubmit.co/ajax/4f494987fba30d06e09c30445899cf4c";

            const resp = await fetch(ajaxUrl, {
              method: "POST",
              body: fd,
              headers: { "Accept": "application/json" }
            });

            if (!resp.ok) throw new Error("Non-200 response");
            try { await resp.json(); } catch (_) {}

            if (statusEl) {
              statusEl.innerHTML =
                "Thank you — your message has been sent. We’ll get back to you as soon as possible." +
                "<small>If you do not receive a response, please call or message via WhatsApp from a vehicle page.</small>";
              statusEl.hidden = false;
            }

            form.reset();

            // Update URL to reflect sent state (helps repeat tests)
            const url = new URL(window.location.href);
            url.searchParams.set("sent", "1");
            window.history.replaceState({}, "", url.toString());

          } catch (err) {
            if (statusEl) {
              statusEl.innerHTML =
                "Sorry — we couldn’t confirm sending your message from this device. Please try again, or contact us via WhatsApp." +
                "<small>If you are on an iPhone/iPad, try Private Browsing (or refresh with a new cache-bust query string).</small>";
              statusEl.hidden = false;
            }
            // Optional: fall back to standard navigation submission
            // form.submit();
          } finally {
            if (submitBtn) {
              submitBtn.disabled = false;
              submitBtn.textContent = "Send Message";
            }
          }
        });
      }

      // Anonymous analytics ping (aggregated)
      try {
        fetch("/cars-api/track", { method: "POST", keepalive: true }).catch(function(){});
      } catch (e) {}
    })();
  </script>
</body>
</html>
