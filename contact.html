<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact – Project 55 Motors</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="hero-header">
    <img src="assets/hero-banner.jpg" alt="Shropshire Hills" class="hero-banner">
    <img src="logo.png" alt="Project 55 Motors" class="hero-logo">
  </header>

  <nav class="main-nav">
    <a href="index.html">Home</a>
    <a href="inventory.html">Current Stock</a>
    <a href="about.html">About</a>
    <a href="contact.html" class="active">Contact</a>
  </nav>

  <main class="page-wrapper">
    <h1 class="page-title">Contact Us</h1>
    <p class="page-intro">
      Get in touch to ask a question or arrange a viewing — we normally reply within a few hours.
    </p>

    <form action="https://formsubmit.co/YOUREMAIL@EXAMPLE.COM"
          method="POST"
          class="contact-form">

      <!-- pre-fill message from vehicle page -->
      <input type="hidden" name="_subject" value="Website enquiry – Project 55 Motors">

      <label>Your Name</label>
      <input type="text" name="name" required>

      <label>Email Address</label>
      <input type="email" name="email" required>

      <label>Phone Number</label>
      <input type="text" name="phone">

      <label>Your Message</label>
      <textarea name="message" id="message" rows="6" required></textarea>

      <button type="submit" class="btn-primary">Send Message</button>
    </form>
  </main>

  <footer>
    © 2025 Project 55 Motors – South Shropshire. All rights reserved.
  </footer>

  <script src="admin-shortcut.js"></script>
  <script>
    // Pull ?msg=… from the URL and prefill the message box
    const params = new URLSearchParams(window.location.search);
    const msg = params.get("msg");
    if (msg) {
      const field = document.getElementById("message");
      if (field) field.value = msg;
    }
  </script>
</body>
</html>
