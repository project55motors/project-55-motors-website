<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact – Project 55 Motors</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- HERO HEADER -->
    <header class="hero-header">
        <img src="assets/hero-banner.jpg" alt="Shropshire Hills" class="hero-banner">
        <img src="logo.png" alt="Project 55 Motors" class="hero-logo">
    </header>

    <!-- NAVIGATION -->
    <nav class="main-nav">
        <a href="index.html">Home</a>
        <a href="inventory.html">Current Stock</a>
        <a href="about.html">About</a>
        <a href="contact.html" class="active">Contact</a>
    </nav>

    <!-- PAGE CONTENT -->
    <main class="page-wrapper">

        <h1 class="page-title">Contact Us</h1>

        <p class="page-intro">
            If you would like to enquire about a vehicle, request additional information or arrange a viewing,
            please send us a message using the form below.
        </p>

        <!-- FORM -->
        <form action="https://formsubmit.co/YOUR_EMAIL_HERE" method="POST" class="contact-form narrow-form">

            <!-- Prefilled hidden subject -->
            <input type="hidden" name="_subject" value="Vehicle Enquiry via Website">

            <label>Your Name</label>
            <input type="text" name="name" required>

            <label>Email Address</label>
            <input type="email" name="email" required>

            <label>Phone Number</label>
            <input type="text" name="phone">

            <label>Your Message</label>
            <textarea id="message" name="message" rows="6" required></textarea>

            <button type="submit" class="btn-primary">Send Message</button>
        </form>

    </main>

    <!-- FOOTER -->
    <footer>
        © 2025 Project 55 Motors – South Shropshire. All rights reserved.
    </footer>


    <!-- 🔐 HIDDEN ADMIN LOGIN MODAL -->
    <div id="admin-login-modal" class="modal">
        <div class="modal-content">
            <span class="modal-close">&times;</span>
            <h2>Staff Login</h2>

            <form id="admin-login-form">
                <input type="text" name="username" placeholder="Username" required>
                <input type="password" name="password" placeholder="Password" required>
                <button type="submit">Log In</button>
            </form>

            <p id="admin-login-error" style="color:red; display:none;"></p>
        </div>
    </div>

    <!-- SCRIPTS -->
    <script src="admin-shortcut.js"></script>

    <!-- 🔧 Auto-fill enquiry message -->
    <script>
        const params = new URLSearchParams(window.location.search);
        const msg = params.get("msg");
        if (msg) {
            const field = document.getElementById("message");
            if (field) field.value = decodeURIComponent(msg);
        }
    </script>

</body>
</html>
