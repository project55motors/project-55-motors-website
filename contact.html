<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact – Project 55 Motors</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

<header>
    <img src="logo.png" alt="Project 55 Motors" class="logo" style="height:72px;">
    <nav>
        <a href="index.html">Home</a>
        <a href="inventory.html">Current Stock</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
    </nav>
</header>

<div class="page-section" style="text-align:center;">
    <h1>Contact & Enquiries</h1>

    <p style="font-size:1.15rem; max-width:600px; margin:0 auto 2.5rem;">
        Whether you’re interested in one of our current cars or would like a free valuation of your own,
        we’re here to help. We only source cars we would be happy to own ourselves.
    </p>

    <form action="https://formspree.io/f/xdkydoar" method="POST"
          style="max-width:500px; margin:0 auto; text-align:left;">
        <input type="text" name="name" placeholder="Your name" required class="form-field">
        <input type="email" name="email" placeholder="Your email" required class="form-field">
        <input type="tel" name="phone" placeholder="Phone (optional)" class="form-field">
        <textarea name="message" id="message-box" rows="5" placeholder="Your message or enquiry" required class="form-field"></textarea>

        <button type="submit" class="cta" style="width:100%;">Send Message</button>
    </form>
</div>

<footer>
    <p>© 2025 Project 55 Motors – Shropshire</p>
</footer>

<script>
    // Auto-populate contact form if coming from a vehicle page
    const params = new URLSearchParams(window.location.search);
    if (params.has("car")) {
        const carName = decodeURIComponent(params.get("car"));
        const box = document.getElementById("message-box");
        box.value = "Hello, I am interested in the " + carName + ".";
    }
</script>

<script src="admin-shortcut.js"></script>
</body>
</html>
