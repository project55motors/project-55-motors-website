<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact – Project 55 Motors</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- HERO HEADER -->
    <header class="hero-header">
        <img src="assets/hero-banner.jpg" alt="Shropshire Hills" class="hero-banner">
        <img src="logo.png" alt="Project 55 Motors" class="hero-logo">
    </header>

    <!-- NAVIGATION -->
    <nav class="main-nav">
        <a href="index.html">Home</a>
        <a href="inventory.html">Current Stock</a>
        <a href="about.html">About</a>
        <a href="contact.html" class="active">Contact</a>
    </nav>

    <!-- PAGE CONTENT -->
    <main class="page-wrapper">

        <h1 class="page-title">Contact Us</h1>

        <p class="page-intro">
            If you have a question about one of our vehicles or would like to arrange a viewing,
            please get in touch using the form below. We normally reply within a few hours.
        </p>

        <!-- CONTACT FORM (600px premium layout) -->
        <form action="https://formsubmit.co/YOUR_EMAIL_HERE" method="POST" class="contact-form narrow-form">

            <label>Your Name</label>
            <input type="text" name="name" required>

            <label>Email Address</label>
            <input type="email" name="email" required>

            <label>Phone Number</label>
            <input type="text" name="phone">

            <label>Your Message</label>
            <textarea id="message" name="message" rows="6" required></textarea>

            <button type="submit" class="btn-primary">Send Message</button>
        </form>

    </main>

    <!-- FOOTER -->
    <footer>
        © 2025 Project 55 Motors – South Shropshire. All rights reserved.
    </footer>

    <script src="admin-shortcut.js"></script>

    <!-- PREFILL ENQUIRY MESSAGE FROM VEHICLE PAGE -->
    <script>
        const params = new URLSearchParams(window.location.search);
        const msg = params.get("msg");
        if (msg) {
            const field = document.getElementById("message");
            if (field) field.value = msg;
        }
    </script>

</body>
</html>
