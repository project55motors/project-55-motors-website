<script src="/site.js"></script>

<script>
    // Pre-fill from ?msg= in query string
    const params = new URLSearchParams(window.location.search);
    const preMsg = params.get("msg");
    if (preMsg) {
        const msgField = document.getElementById("message");
        if (msgField) msgField.value = preMsg;
    }

    // Premium: support structured pre-fill from vehicle pages
    // Usage: /contact.html?vehicle=Fiat%20500%20Lounge&reg=WO21%20KZU&url=https%3A%2F%2Fproject55motors.co.uk%2Fvehicle.html%3Fid%3D...
    const vehicle = params.get("vehicle");
    const reg = params.get("reg");
    const sourceUrl = params.get("url");
    if (vehicle || reg || sourceUrl) {
        const msgField = document.getElementById("message");
        const lines = [];
        if (vehicle) lines.push(`Vehicle: ${vehicle}`);
        if (reg) lines.push(`Registration: ${reg}`);
        if (sourceUrl) lines.push(`Link: ${sourceUrl}`);
        const header = lines.join(" | ");

        // Add hidden fields so the email contains structured context
        const form = document.getElementById("contactForm");
        if (form) {
            if (vehicle) {
                const i = document.createElement("input");
                i.type = "hidden"; i.name = "vehicle"; i.value = vehicle;
                form.appendChild(i);
            }
            if (reg) {
                const i = document.createElement("input");
                i.type = "hidden"; i.name = "registration"; i.value = reg;
                form.appendChild(i);
            }
            if (sourceUrl) {
                const i = document.createElement("input");
                i.type = "hidden"; i.name = "vehicle_link"; i.value = sourceUrl;
                form.appendChild(i);
            }
        }

        // Prepend to message if it's empty or doesn't already include it
        if (msgField) {
            const existing = (msgField.value || "").trim();
            if (!existing || !existing.includes("Vehicle:")) {
                msgField.value = header + "\n\n" + existing;
            }
        }
    }
</script>
<!-- 🔒 Long-press (2s+) on the hero car banner to open staff login -->
<script>
(function(){
  const HOLD_MS = 2100;   // 2 seconds+ (slightly over to avoid accidental triggers)
  const MOVE_PX = 12;     // cancel if finger moves (scroll gesture)
  const el = document.querySelector('.hero-banner');
  if (!el) return;

  // Reduce iOS image callout / selection
  try {
    el.style.webkitTouchCallout = 'none';
    el.style.webkitUserSelect = 'none';
    el.style.userSelect = 'none';
  } catch (e) {}

  let timer = null;
  let startX = 0, startY = 0;
  let active = false;

  function clearHold(){
    if (timer) { clearTimeout(timer); timer = null; }
    active = false;
  }

  function openStaffLogin(){
    clearHold();

    // Prefer your existing helper, if present
    if (typeof window.openAdminModal === 'function') {
      window.openAdminModal();
      return;
    }

    // Fallback: show the modal if it exists
    const modal = document.getElementById('adminLoginModal');
    if (modal) {
      modal.style.display = 'block';
      modal.setAttribute('aria-hidden', 'false');
      return;
    }

    // Last resort: direct navigation
    window.location.href = '/admin-dashboard';
  }

  function onStart(e){
    if (e.touches && e.touches.length > 1) return; // ignore multi-touch
    const p = e.touches ? e.touches[0] : e;
    startX = p.clientX;
    startY = p.clientY;
    active = true;

    if (timer) clearTimeout(timer);
    timer = setTimeout(openStaffLogin, HOLD_MS);
  }

  function onMove(e){
    if (!active || !timer) return;
    const p = e.touches ? e.touches[0] : e;
    const dx = Math.abs(p.clientX - startX);
    const dy = Math.abs(p.clientY - startY);
    if (dx > MOVE_PX || dy > MOVE_PX) clearHold();
  }

  el.addEventListener('touchstart', onStart, { passive: true });
  el.addEventListener('touchmove', onMove, { passive: true });
  el.addEventListener('touchend', clearHold, { passive: true });
  el.addEventListener('touchcancel', clearHold, { passive: true });

  // Prevent desktop right-click menu on the banner image
  el.addEventListener('contextmenu', function(ev){ ev.preventDefault(); });
})();
</script>
