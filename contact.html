    <img src="assets/hero-banner.jpg" class="hero-banner">
    <img src="logo.png" class="hero-logo">
</header>

<nav class="main-nav">

<main class="page-wrapper center">

    <h1 class="page-title">Contact Us</h1>

    <p class="page-intro">
        Get in touch to ask a question or arrange a viewing — we normally reply within a few hours.
    </p>

    <form action="https://formsubmit.co/YOUR_EMAIL" method="POST" class="contact-form narrow-form">

        <label>Your Name</label>
        <input type="text" name="name" required>

        <label>Email Address</label>
        <input type="email" name="email" required>

        <label>Phone Number</label>
        <input type="text" name="phone">

        <label>Your Message</label>
        <textarea name="message" rows="6" required></textarea>

        <button class="btn-primary">Send Message</button>
    </form>

</main>
