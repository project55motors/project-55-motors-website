<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Current Stock – Project 55 Motors</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- HERO HEADER -->
    <header class="hero-header">
        <img src="assets/hero-banner.jpg" alt="Shropshire Hills" class="hero-banner">
        <img src="logo.png" alt="Project 55 Motors" class="hero-logo">
    </header>

    <!-- NAVIGATION -->
    <nav class="main-nav">
        <a href="index.html">Home</a>
        <a href="inventory.html" class="active">Current Stock</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
    </nav>

    <!-- MAIN CONTENT -->
    <main class="page-wrapper">
        <h1 class="page-title">Current Stock</h1>
        <p class="page-intro">Browse our available vehicles — professionally inspected, fully prepared and ready to drive away.</p>

        <div id="car-grid" class="car-grid"></div>
    </main>

    <!-- FOOTER -->
    <footer>
        © 2025 Project 55 Motors – South Shropshire. All rights reserved.
    </footer>


    <!-- 🔐 HIDDEN ADMIN LOGIN MODAL -->
    <div id="adminLoginModal" class="modal" style="display:none;">
        <div class="modal-content">
            <span class="close-btn" onclick="hideLoginModal()">×</span>
            <h2>Staff Login</h2>

            <input type="text" id="adminUser" placeholder="Username" required>
            <input type="password" id="adminPass" placeholder="Password" required>

            <button class="login-btn" onclick="submitLogin()">Log In</button>

            <p id="admin-login-error" style="color:red; display:none;"></p>
        </div>
    </div>


    <!-- SCRIPTS -->
    <script src="cars.js"></script>
    <script src="admin-shortcut.js"></script>

</body>
</html>
