<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehicle Details – Project 55 Motors</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div class="detail-container" id="detail-container">

        <div class="detail-grid">

            <!-- LEFT SIDE: IMAGES -->
            <div>
                <div id="main-photo-container">
                    <img id="main-photo" src="placeholder.jpg" alt="Vehicle Image">
                </div>

                <div id="thumbnails" class="thumbnail-row"></div>
            </div>

            <!-- RIGHT SIDE: SPECIFICATION BOX -->
            <div class="detail-specs">

                <h1 id="car-name">Loading...</h1>
                <p id="car-description" class="detail-short"></p>

                <div class="spec-list">
                    <div><strong>Registration:</strong> <span id="car-registration"></span></div>
                    <div><strong>Mileage:</strong> <span id="car-mileage"></span></div>
                    <div><strong>MOT:</strong> <span id="car-mot"></span></div>
                    <div><strong>Engine Size:</strong> <span id="car-engine"></span></div>
                    <div><strong>Fuel:</strong> <span id="car-fuel"></span></div>
                    <div><strong>Price:</strong> £<span id="car-price"></span></div>
                </div>

            </div>
        </div>

        <!-- FULL DESCRIPTION -->
        <div class="detail-description">
            <h2>Full Description</h2>
            <p id="car-full-description"></p>
        </div>

    </div>

    <script src="detail.js"></script>

</body>
</html>
