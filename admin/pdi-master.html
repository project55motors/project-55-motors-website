<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project 55 Motors - PDI Master (Admin)</title>

<style>
:root {
  --ink:#111;
  --muted:#555;
  --line:#333;
  --soft:#ededed;
  --grid:#9a9a9a;
  --font: Arial, Helvetica, sans-serif;
}

/* A4 setup */
@page { size: A4; margin: 12mm; }

* { box-sizing: border-box; }
body { margin:0; font-family: var(--font); color: var(--ink); }

/* PAGE CONTROL */
.page {
  page-break-after: always;
}
.page:last-child {
  page-break-after: auto;
}

/* STRUCTURE */
header {
  display:flex;
  align-items:flex-start;
  gap:12px;
  padding-bottom:6px;
  border-bottom:1.5px solid var(--line);
}

header img { width:42mm; }

h1 { margin:0; font-size:15pt; }
.sub { font-size:8.5pt; color:var(--muted); }

.meta { font-size:7.5pt; color:var(--muted); text-align:right; }

/* SECTIONS */
.section-title {
  margin-top:8px;
  padding:3px 5px;
  background:var(--soft);
  border:1px solid var(--line);
  font-weight:700;
  font-size:9pt;
}

/* GRID */
.grid {
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:6px;
  margin-top:6px;
}

/* FIELDS */
.field label {
  font-size:7.5pt;
  margin-bottom:2px;
  display:block;
}

.field input {
  width:100%;
  border:1px solid var(--line);
  padding:3px 5px;
  font-size:8.5pt;
}

/* TABLE */
table {
  width:100%;
  border-collapse:collapse;
  margin-top:5px;
}

th, td {
  border:1px solid var(--grid);
  padding:3px 4px;
  font-size:7.5pt;
}

th { background:#f3f3f3; }

td.c {
  text-align:center;
  width:8mm;
}

td.item { width:48%; }

td input[type="text"] {
  width:100%;
  border:0;
  border-bottom:1px solid #777;
  font-size:7.5pt;
}

/* PRINT FIXES */
@media print {

  html, body {
    width:210mm;
    margin:0;
    padding:0;
  }

  .page {
    width:186mm;
    min-height:273mm;
    margin:0 auto;
  }

  table, tr, td, th {
    page-break-inside: avoid !important;
    break-inside: avoid !important;
  }

  .section-title {
    page-break-after: avoid;
  }

  .grid {
    break-inside: avoid;
  }

}

/* ADMIN UI */
.toolbar, .toast, .errbox {
  display:none !important;
}

</style>
</head>

<body>

<div id="pdiDocument">

<!-- PAGE 1 -->
<div class="page">
<header>
<img src="/assets/logo.svg">
<div>
<h1>PDI & Handover Checklist</h1>
<div class="sub">Project 55 Motors</div>
</div>
<div class="meta">Page 1</div>
</header>

<div class="section-title">Vehicle Details</div>

<div class="grid">
<div class="field"><label>Inspection date</label><input name="veh_date" type="date"></div>
<div class="field"><label>Inspector</label><input name="veh_inspector"></div>
<div class="field"><label>Reg</label><input name="veh_reg"></div>
</div>

<div class="section-title">Exterior</div>
<table>
<tr><th>Item</th><th>OK</th><th>R</th><th>N/A</th><th>Notes</th></tr>

<tr>
<td class="item">Bodywork condition</td>
<td class="c"><input type="radio" name="ext_01"></td>
<td class="c"><input type="radio" name="ext_01"></td>
<td class="c"><input type="radio" name="ext_01"></td>
<td><input name="ext_01_note"></td>
</tr>

</table>
</div>

<!-- PAGE 2 -->
<div class="page">
<header>
<h1>Interior & Docs</h1>
<div class="meta">Page 2</div>
</header>

<div class="section-title">Interior</div>
<table>
<tr><th>Item</th><th>OK</th><th>R</th><th>N/A</th><th>Notes</th></tr>
<tr>
<td class="item">Warning lights</td>
<td class="c"><input type="radio"></td>
<td class="c"><input type="radio"></td>
<td class="c"><input type="radio"></td>
<td><input></td>
</tr>
</table>
</div>

<!-- PAGE 3 -->
<div class="page">
<header>
<h1>Final Checks & Signoff</h1>
<div class="meta">Page 3</div>
</header>

<div class="section-title">Final Notes</div>
<textarea style="width:100%;height:40mm;"></textarea>

</div>

</div>

<script src="pdi-master-fixed.js"></script>
</body>
</html>
