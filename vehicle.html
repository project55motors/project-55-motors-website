<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehicle Details – Project 55 Motors</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- NAV -->
    <nav>
        <div class="container">
            <a href="index.html"><img src="logo.png" alt="Project 55 Motors" style="height:45px;"></a>
            <div class="links">
                <a href="index.html">Home</a>
                <a href="inventory.html">Current Stock</a>
                <a href="about.html">About</a>
                <a href="contact.html">Contact</a>
            </div>
        </div>
    </nav>

    <!-- PAGE CONTENT -->
    <div id="vehicle-container">

        <!-- MAIN IMAGE -->
        <img id="vehicle-main-photo" src="" alt="Vehicle photo">

        <!-- THUMBNAILS -->
        <div id="vehicle-thumbnails"></div>

        <!-- TITLE -->
        <h1 id="vehicle-title"></h1>

        <!-- SPEC GRID -->
        <div id="vehicle-spec-grid">
            <div><strong>Registration:</strong> <span id="spec-reg"></span></div>
            <div><strong>Price:</strong> <span id="spec-price"></span></div>
            <div><strong>Mileage:</strong> <span id="spec-mileage"></span></div>
            <div><strong>MOT:</strong> <span id="spec-mot"></span></div>
            <div><strong>Engine Size:</strong> <span id="spec-engine"></span></div>
            <div><strong>Fuel Type:</strong> <span id="spec-fuel"></span></div>
        </div>

        <!-- FULL DESCRIPTION -->
        <div id="vehicle-description"></div>

    </div>

    <!-- FULLSCREEN OVERLAY -->
    <div id="fullscreen-overlay" style="display:none;">
        <img id="fullscreen-image" src="">
    </div>

    <script src="vehicle.js"></script>
    <script src="admin-shortcut.js"></script>
</body>
</html>
