<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehicle Details – Project 55 Motors</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- HERO -->
    <header class="hero-header">
        <img src="assets/hero-banner.jpg" alt="Shropshire Hills" class="hero-banner">
        <img src="logo.png" alt="Project 55 Motors" class="hero-logo">
    </header>

    <!-- NAV -->
    <nav class="main-nav">
        <a href="index.html">Home</a>
        <a href="inventory.html">Current Stock</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
    </nav>

    <!-- CONTENT -->
    <main class="page-wrapper">

        <div id="vehicle-container">

            <!-- HERO IMAGE -->
            <img id="vehicle-main-photo" src="" alt="Vehicle Image" class="vehicle-hero">

            <!-- THUMBNAILS -->
            <div id="vehicle-thumbnails" class="vehicle-thumbnails"></div>

            <!-- TITLE -->
            <h1 id="vehicle-title"></h1>

            <!-- SPECS -->
            <div id="vehicle-spec-grid" class="vehicle-spec-grid">
                <div><strong>Registration:</strong> <span id="spec-reg"></span></div>
                <div><strong>Price:</strong> <span id="spec-price"></span></div>
                <div><strong>Mileage:</strong> <span id="spec-mileage"></span></div>
                <div><strong>MOT:</strong> <span id="spec-mot"></span></div>
                <div><strong>Engine Size:</strong> <span id="spec-engine"></span></div>
                <div><strong>Fuel Type:</strong> <span id="spec-fuel"></span></div>
            </div>

            <!-- DESCRIPTION -->
            <div id="vehicle-description" class="vehicle-description"></div>

            <!-- ENQUIRY BUTTON -->
            <div class="cta-box">
                <a id="enquiry-btn" class="btn-primary">Enquire About This Vehicle</a>
            </div>

        </div>

    </main>

    <!-- FOOTER -->
    <footer>
        © 2025 Project 55 Motors – South Shropshire. All rights reserved.
    </footer>


    <!-- 🔐 HIDDEN ADMIN LOGIN MODAL -->
    <div id="admin-login-modal" class="modal">
        <div class="modal-content">
            <span class="modal-close">&times;</span>
            <h2>Staff Login</h2>

            <form id="admin-login-form">
                <input type="text" name="username" placeholder="Username" required>
                <input type="password" name="password" placeholder="Password" required>
                <button type="submit">Log In</button>
            </form>

            <p id="admin-login-error" style="color:red; display:none;"></p>
        </div>
    </div>

    
    <!-- SCRIPTS -->
    <script src="vehicle.js"></script>
    <script src="admin-shortcut.js"></script>

    <script>
    // 🔧 Automatically fills enquiry form text using URL parameters
    document.addEventListener("DOMContentLoaded", () => {
        const btn = document.getElementById("enquiry-btn");
        if (!btn) return;

        // Vehicle info from the already-loaded page JS
        setTimeout(() => {
            const title = document.getElementById("vehicle-title")?.innerText || "";
            const reg = document.getElementById("spec-reg")?.innerText || "";

            const encoded = encodeURIComponent(
                `I am interested in the ${title} with registration ${reg}.`
            );

            btn.href = `contact.html?msg=${encoded}`;
        }, 500);
    });
    </script>

</body>
</html>
