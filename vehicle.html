<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehicle Details – Project 55 Motors</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- HERO HEADER -->
    <header class="hero-header">
        <img src="assets/hero-banner.jpg" alt="Shropshire Hills" class="hero-banner">
        <img src="logo.png" alt="Project 55 Motors" class="hero-logo">
    </header>

    <!-- NAVIGATION -->
    <nav class="main-nav">
        <a href="index.html">Home</a>
        <a href="inventory.html">Current Stock</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
    </nav>

    <!-- VEHICLE CONTENT -->
    <main class="vehicle-wrapper">

        <!-- MAIN IMAGE (NATURAL FIT) -->
        <img id="vehicle-main-photo" class="vehicle-main-photo" src="" alt="Vehicle photo">

        <!-- THUMBNAILS -->
        <div id="vehicle-thumbnails" class="thumbnail-row"></div>

        <!-- TITLE -->
        <h1 id="vehicle-title" class="vehicle-title"></h1>

        <!-- SPEC GRID -->
        <section class="vehicle-spec-grid">
            <div><strong>Registration:</strong> <span id="spec-reg"></span></div>
            <div><strong>Mileage:</strong> <span id="spec-mileage"></span></div>
            <div><strong>Engine Size:</strong> <span id="spec-engine"></span></div>
            <div><strong>Fuel Type:</strong> <span id="spec-fuel"></span></div>
            <div><strong>MOT:</strong> <span id="spec-mot"></span></div>
            <div><strong>Price:</strong> <span id="spec-price"></span></div>
        </section>

        <!-- DESCRIPTION -->
        <section id="vehicle-description" class="vehicle-description"></section>

        <!-- ENQUIRE -->
        <button id="enquire-btn" class="btn-primary enquire-btn">
            Enquire About This Vehicle
        </button>

    </main>

    <!-- FOOTER -->
    <footer>
        © 2025 Project 55 Motors – South Shropshire. All rights reserved.
    </footer>

    <script src="vehicle.js"></script>
    <script src="admin-shortcut.js"></script>

</body>
</html>
