<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehicle Details – Project 55 Motors</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- HERO BANNER -->
    <header class="hero-header">
        <img src="assets/hero-banner.jpg" alt="Shropshire Hills" class="hero-banner">
        <img src="logo.png" alt="Project 55 Motors" class="hero-logo">
    </header>

    <!-- NAVIGATION -->
    <nav class="main-nav">
        <a href="index.html">Home</a>
        <a href="inventory.html">Current Stock</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
    </nav>

    <!-- VEHICLE PAGE CONTENT -->
    <main class="page-wrapper vehicle-page">

        <!-- TOP: MAIN IMAGE + THUMBNAILS -->
        <section class="vehicle-media-section">
            <div class="vehicle-main-photo-wrapper">
                <img id="vehicle-main-photo" class="vehicle-main-photo" src="" alt="Vehicle photo">
            </div>

            <div id="vehicle-thumbnails" class="vehicle-thumbnails">
                <!-- Thumbnails injected by vehicle.js -->
            </div>
        </section>

        <!-- VEHICLE TITLE + SPEC GRID -->
        <section class="vehicle-main-info">
            <h1 id="vehicle-title" class="vehicle-title"></h1>

            <div class="vehicle-spec-grid">
                <div class="spec-item">
                    <span class="spec-label">Registration</span>
                    <span id="spec-reg" class="spec-value"></span>
                </div>
                <div class="spec-item">
                    <span class="spec-label">Mileage</span>
                    <span id="spec-mileage" class="spec-value"></span>
                </div>
                <div class="spec-item">
                    <span class="spec-label">Engine Size</span>
                    <span id="spec-engine" class="spec-value"></span>
                </div>
                <div class="spec-item">
                    <span class="spec-label">Fuel Type</span>
                    <span id="spec-fuel" class="spec-value"></span>
                </div>
                <div class="spec-item">
                    <span class="spec-label">MOT</span>
                    <span id="spec-mot" class="spec-value"></span>
                </div>
                <div class="spec-item spec-price">
                    <span class="spec-label">Price</span>
                    <span id="spec-price" class="spec-value"></span>
                </div>
            </div>
        </section>

        <!-- DESCRIPTION -->
        <section class="vehicle-description-section">
            <h2>Vehicle Description</h2>
            <div id="vehicle-description" class="vehicle-description">
                <!-- Full description injected by vehicle.js -->
            </div>
        </section>

        <!-- ENQUIRE BUTTON -->
        <section class="vehicle-enquire-section">
            <button id="enquire-btn" class="btn-primary enquire-btn">
                Enquire About This Vehicle
            </button>
        </section>

    </main>

    <!-- FOOTER -->
    <footer>
        © 2025 Project 55 Motors – South Shropshire. All rights reserved.
    </footer>

    <script src="vehicle.js"></script>
    <script src="admin-shortcut.js"></script>
</body>
</html>
