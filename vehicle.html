<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehicle Details – Project 55 Motors</title>

    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="styles.css?v=20">

    <!-- JS -->
    <script src="vehicle.js" defer></script>
    <script src="admin-shortcut.js" defer></script>
</head>

<body>

    <!-- =====================================
         FULL-WIDTH BANNER + LOGO
    ====================================== -->
    <header class="hero-header">

        <div class="hero-banner">
            <img src="assets/hero-banner.jpg" alt="Shropshire Hills" class="hero-image">
            <div class="hero-overlay"></div>

            <!-- LOGO OVERLAY -->
            <div class="hero-logo-box">
                <a href="index.html">
                    <img src="logo.png" alt="Project 55 Motors" class="hero-logo">
                </a>
            </div>
        </div>

        <!-- NAVIGATION BELOW BANNER -->
        <nav class="main-nav">
            <div class="nav-inner">
                <a href="index.html">Home</a>
                <a href="inventory.html">Current Stock</a>
                <a href="about.html">About</a>
                <a href="contact.html">Contact</a>
            </div>
        </nav>

    </header>

    <!-- =====================================
         PAGE CONTENT
    ====================================== -->
    <main class="page-container vehicle-page">

        <!-- HERO IMAGE -->
        <div class="vehicle-media">
            <img id="vehicle-main-photo" class="vehicle-hero-photo" src="" alt="Vehicle Photo">
            <div id="vehicle-thumbnails" class="vehicle-thumbnails"></div>
        </div>

        <!-- TITLE -->
        <h1 id="vehicle-title" class="vehicle-title"></h1>

        <!-- SPECS GRID -->
        <section class="vehicle-spec-section">
            <div class="spec-grid">

                <div class="spec-item">
                    <span class="spec-label">Registration</span>
                    <span id="spec-reg" class="spec-value"></span>
                </div>

                <div class="spec-item">
                    <span class="spec-label">Mileage</span>
                    <span id="spec-mileage" class="spec-value"></span>
                </div>

                <div class="spec-item">
                    <span class="spec-label">Engine Size</span>
                    <span id="spec-engine" class="spec-value"></span>
                </div>

                <div class="spec-item">
                    <span class="spec-label">Fuel Type</span>
                    <span id="spec-fuel" class="spec-value"></span>
                </div>

                <div class="spec-item">
                    <span class="spec-label">MOT</span>
                    <span id="spec-mot" class="spec-value"></span>
                </div>

                <div class="spec-item spec-price">
                    <span class="spec-label">Price</span>
                    <span id="spec-price" class="spec-value price-value"></span>
                </div>

            </div>
        </section>

        <!-- DESCRIPTION -->
        <section class="vehicle-description-section">
            <h2>Vehicle Description</h2>
            <div id="vehicle-description" class="vehicle-description"></div>
        </section>

        <!-- ENQUIRE BUTTON -->
        <div class="enquire-wrapper">
            <a id="enquire-button" class="btn-primary enquire-btn" href="contact.html">
                Enquire About This Vehicle
            </a>
        </div>

    </main>

    <!-- FULLSCREEN VIEWER -->
    <div id="fullscreen-overlay" style="display:none;">
        <img id="fullscreen-image" src="">
    </div>

</body>
</html>
