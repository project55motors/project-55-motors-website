<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehicle Details – Project 55 Motors</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>
<header>
    <img src="logo.png" class="logo" alt="Project 55 Motors">
    <nav>
        <a href="index.html">Home</a>
        <a href="inventory.html">Stock</a>
        <a href="contact.html">Contact</a>
    </nav>
</header>

<div class="vehicle-page">
    <div class="vehicle-gallery">
        <div class="vehicle-gallery-main">
            <img id="main-photo" src="/placeholder.png">
        </div>
        <div class="vehicle-gallery-thumbs" id="thumbs"></div>
    </div>

    <div class="vehicle-info">
        <h2 id="title"></h2>
        <div class="price" id="price"></div>

        <ul id="specs"></ul>

        <h3>Description</h3>
        <p id="description"></p>
    </div>
</div>

<footer>
    © Project 55 Motors – Premium Used Vehicles in Shropshire
</footer>

<script>
// Traffic tracking
fetch("/cars-api/track", { method: "POST" });

async function loadVehicle() {
    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");

    const res = await fetch(`/cars-api/vehicle?id=${id}`);
    const f = await res.json();

    document.getElementById("title").innerText = f.Make_Model;
    document.getElementById("price").innerText = "£" + (f.Price?.toLocaleString() || "");

    // Gallery
    const mainPhoto = document.getElementById("main-photo");
    const thumbs = document.getElementById("thumbs");

    const photos = f.Photos || [];

    if (photos.length > 0) {
        mainPhoto.src = photos[0].url;
        thumbs.innerHTML = "";

        photos.forEach(p => {
            const t = document.createElement("img");
            t.src = p.url;
            t.onclick = () => mainPhoto.src = p.url;
            thumbs.appendChild(t);
        });
    }

    // Specs
    const specs = document.getElementById("specs");
    specs.innerHTML = `
        <li>Registration: ${f.Registration || "--"}</li>
        <li>Mileage: ${f.Mileage?.toLocaleString() || "--"} miles</li>
        <li>Transmission: ${f.Transmission || "--"}</li>
        <li>Engine Size: ${f.Engine_size || "--"}</li>
        <li>Fuel Type: ${f.Fuel_type || "--"}</li>
        <li>MOT: ${f.MOT_Date || "--"}</li>
    `;

    document.getElementById("description").innerText =
        f.Full_Description || "No description available.";
}

loadVehicle();
</script>

</body>
</html>
