<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehicle Details – Project 55 Motors</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="hero-header">
    <img src="assets/hero-banner.jpg" alt="Shropshire Hills" class="hero-banner">
    <img src="logo.png" alt="Project 55 Motors" class="hero-logo">
</header>

<nav class="main-nav">
    <div class="main-nav-inner">
        <a href="index.html">Home</a>
        <a href="inventory.html">Current Stock</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
    </div>
</nav>

<main class="page-wrapper" id="vehicle-page">
    <div class="vehicle-layout">
        <!-- Media column -->
        <div class="vehicle-media">
            <div class="vehicle-hero-wrapper">
                <img id="vehicle-hero" class="vehicle-hero" src="" alt="Vehicle photo">
            </div>

            <div class="vehicle-thumbs-wrapper">
                <button type="button" class="thumb-arrow" id="thumb-left" aria-label="Previous photos">‹</button>
                <div id="vehicle-thumbs" class="vehicle-thumbs"></div>
                <button type="button" class="thumb-arrow" id="thumb-right" aria-label="More photos">›</button>
            </div>
        </div>

        <!-- Info column -->
        <div class="vehicle-info">
            <h1 id="vehicle-title" class="vehicle-title"></h1>
            <p id="vehicle-reg" class="vehicle-reg"></p>
            <p id="vehicle-price" class="vehicle-price"></p>

            <div class="vehicle-spec-grid">
                <div class="vehicle-spec-item">
                    <label>Mileage</label>
                    <span id="vehicle-mileage"></span>
                </div>
                <div class="vehicle-spec-item">
                    <label>MOT</label>
                    <span id="vehicle-mot"></span>
                </div>
                <div class="vehicle-spec-item">
                    <label>Engine</label>
                    <span id="vehicle-engine"></span>
                </div>
                <div class="vehicle-spec-item">
                    <label>Fuel</label>
                    <span id="vehicle-fuel"></span>
                </div>
            </div>

            <div class="vehicle-description">
                <p id="vehicle-description"></p>
            </div>

            <button id="enquire-btn" class="btn-primary enquire-btn">
                Enquire About This Vehicle
            </button>
        </div>
    </div>
</main>

<footer>
    © 2025 Project 55 Motors – South Shropshire. All rights reserved.
</footer>

<!-- Staff login modal -->
<div id="adminLoginModal" class="modal">
    <div class="modal-content">
        <span class="modal-close" onclick="closeAdminModal()">×</span>
        <h2>Staff Login</h2>

        <form onsubmit="submitAdminLogin(event)">
            <input id="adminUser" type="text" placeholder="Username" required>
            <input id="adminPass" type="password" placeholder="Password" required>
            <button type="submit" class="modal-login-btn">Log In</button>
        </form>

        <p id="admin-login-error" class="modal-error"></p>
    </div>
</div>

<script src="vehicle.js"></script>
<script src="admin-shortcut.js"></script>
</body>
</html>
