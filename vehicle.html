<script>
  // Shareable /stock/...-recXXXX URLs arrive without ?id=.
  // Add the Airtable record ID before vehicle.js runs.
  (function () {
    try {
      var params = new URLSearchParams(window.location.search || "");
      if (params.get("id") || params.get("record") || params.get("rec")) return;

      var path = window.location.pathname || "";
      var match = path.match(/(?:^|[-/])(rec[A-Za-z0-9]{8,})\/?$/);
      if (!match) return;

      params.set("id", match[1]);
      var nextUrl = path + "?" + params.toString() + (window.location.hash || "");
      window.history.replaceState(window.history.state, document.title, nextUrl);
    } catch (_) {}
  })();
</script>
