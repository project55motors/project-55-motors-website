<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehicle Details – Project 55 Motors</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>

<!-- HERO HEADER -->
<header class="hero-header">
    <picture class="hero-picture">
        <source type="image/webp"
                srcset="/assets/hero-banners/hero-banner-512.webp 512w,
                        /assets/hero-banners/hero-banner-768.webp 768w,
                        /assets/hero-banners/hero-banner-1024.webp 1024w,
                        /assets/hero-banners/hero-banner-1536.webp 1536w,
                        /assets/hero-banners/hero-banner-2048.webp 2048w,
                        /assets/hero-banners/hero-banner-5120x1440-master.webp 5120w"
                sizes="100vw">
        <img class="hero-banner"
             src="/assets/hero-banners/hero-banner-1024.jpg"
             srcset="/assets/hero-banners/hero-banner-512.jpg 512w,
                     /assets/hero-banners/hero-banner-768.jpg 768w,
                     /assets/hero-banners/hero-banner-1024.jpg 1024w,
                     /assets/hero-banners/hero-banner-1536.jpg 1536w,
                     /assets/hero-banners/hero-banner-2048.jpg 2048w"
             sizes="100vw"
             width="2048" height="576"
             alt="Project 55 Motors — Carefully Selected Used Cars"
             loading="eager" decoding="async" fetchpriority="high">
    </picture>
</header>

<!-- NAVIGATION -->
<nav class="main-nav">
    <div class="main-nav-inner">
        <a href="/index.html">Home</a>
        <a href="/inventory.html">Current Stock</a>
        <a href="/about.html">About</a>
        <a href="/contact.html">Contact</a>
    </div>
</nav>

<!-- VEHICLE DETAILS -->
<main class="page-wrapper" id="vehicle-page">
    <div class="vehicle-layout">

        <!-- PHOTO AREA -->
        <div class="vehicle-media">
            <div class="vehicle-hero-wrapper">
                <img id="vehicle-hero" class="vehicle-hero" src="" alt="Vehicle Photo">
            </div>

            <div class="vehicle-thumbs-wrapper">
                <button type="button" id="thumb-left" class="thumb-arrow" aria-label="Previous">‹</button>
                <div id="vehicle-thumbs" class="vehicle-thumbs"></div>
                <button type="button" id="thumb-right" class="thumb-arrow" aria-label="Next">›</button>
            </div>
        </div>

        <!-- INFORMATION AREA -->
        <div class="vehicle-info">

            <h1 id="vehicle-title" class="vehicle-title"></h1>
            <p id="vehicle-reg" class="vehicle-reg"></p>
            <p id="vehicle-price" class="vehicle-price"></p>

            <div class="vehicle-spec-grid">
                <div class="vehicle-spec-item">
                    <label>Mileage</label>
                    <span id="vehicle-mileage"></span>
                </div>
                <div class="vehicle-spec-item">
                    <label>MOT</label>
                    <span id="vehicle-mot"></span>
                </div>
                <div class="vehicle-spec-item">
                    <label>Engine</label>
                    <span id="vehicle-engine"></span>
                </div>
                <div class="vehicle-spec-item">
                    <label>Fuel</label>
                    <span id="vehicle-fuel"></span>
                </div>
            </div>

            <div class="vehicle-description">
                <p id="vehicle-description"></p>
            </div>

            <button id="enquire-btn" class="btn-primary enquire-btn">
                Enquire About This Vehicle
            </button>
        </div>
    </div>
</main>

<!-- FOOTER -->
<footer>
    © 2025 Project 55 Motors – South Shropshire. All rights reserved.
</footer>

<!-- 🔐 HIDDEN STAFF LOGIN MODAL (only shown via shortcut) -->
<div id="adminLoginModal" class="modal" style="display:none;">
    <div class="modal-content">
        <span class="modal-close" onclick="closeAdminModal()">×</span>
        <h2>Staff Login</h2>

        <form onsubmit="submitAdminLogin(event)">
            <input id="adminUser" type="text" placeholder="Username" required>
            <input id="adminPass" type="password" placeholder="Password" required>
            <button type="submit" class="modal-login-btn">Log In</button>
        </form>

        <p id="admin-login-error" class="modal-error" style="display:none;"></p>
    </div>
</div>

<!-- SCRIPTS -->
<script src="/vehicle.js"></script>
<script src="/admin-shortcut.js"></script>


<!-- Anonymous analytics ping (aggregated) -->
<script>
  (function(){
    try {
      fetch("/cars-api/track", { method: "POST", keepalive: true }).catch(function(){});
    } catch (e) {}
  })();
</script>
</body>
</html>
