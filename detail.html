<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Project 55 Motors – Vehicle Details">
    <title>Car Details – Project 55 Motors</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<nav>
    <div class="nav-container">
        <a href="/" class="logo"><img src="logo.png" alt="Project 55 Motors"></a>
        <ul>
            <li><a href="/">Home</a></li>
            <li><a href="/inventory.html">Stock</a></li>
            <li><a href="/about.html">About</a></li>
            <li><a href="/contact.html">Contact</a></li>
        </ul>
    </div>
</nav>

<div class="container detail-grid" id="detail-container">
    <div>
        <img id="main-photo" src="placeholder.jpg" alt="Car Main Photo" style="width:100%;border-radius:12px;cursor:pointer;">
        <div id="thumbnails" style="display:flex;gap:0.5rem;margin-top:1rem;flex-wrap:wrap;"></div>
    </div>
    <div class="detail-specs">
        <h1 id="car-name">Loading...</h1>
        <p id="car-description" style="margin-top:1rem;"></p>
        <div style="margin-top:1.5rem;">
            <p><strong>Registration:</strong> <span id="car-registration"></span></p>
            <p><strong>MOT:</strong> <span id="car-mot"></span></p>
            <p><strong>Mileage:</strong> <span id="car-mileage"></span></p>
            <p><strong>Engine size:</strong> <span id="car-engine"></span></p>
            <p><strong>Fuel type:</strong> <span id="car-fuel"></span></p>
            <p><strong>Price:</strong> £<span id="car-price"></span></p>
        </div>
        <div style="margin-top:1rem;">
            <h3>Full Description</h3>
            <p id="car-full-description"></p>
        </div>
    </div>
</div>

<footer>
    <p>© 2025 Project 55 Motors | Cleobury Mortimer, Shropshire<br>
    <a href="mailto:nathan@project55motors.co.uk" style="color:#86868b;">nathan@project55motors.co.uk</a></p>
</footer>

<script src="detail.js"></script>
<script src="/admin-shortcut.js"></script>

</body>
</html>
