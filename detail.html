<!-- Fullscreen Overlay for Images -->
<div id="fullscreen-overlay">
    <span id="fullscreen-close">&times;</span>
    <img id="fullscreen-img" src="" alt="Full screen car image">
</div>

<footer>
    <p>© 2025 Project 55 Motors | Cleobury Mortimer, Shropshire<br>
       <a href="mailto:nathan@project55motors.co.uk" style="color:#86868b;">nathan@project55motors.co.uk</a></p>
</footer>

<script src="detail.js"></script>
<script>
    // Fullscreen image functionality
    const overlay = document.getElementById('fullscreen-overlay');
    const fullscreenImg = document.getElementById('fullscreen-img');
    const closeBtn = document.getElementById('fullscreen-close');

    document.addEventListener('click', (e) => {
        if(e.target.tagName === 'IMG' && e.target.closest('#main-photo-container, #thumbnail-gallery')) {
            fullscreenImg.src = e.target.src;
            overlay.style.display = 'flex';
        }
    });

    closeBtn.addEventListener('click', () => {
        overlay.style.display = 'none';
        fullscreenImg.src = '';
    });

    overlay.addEventListener('click', (e) => {
        if(e.target === overlay) {
            overlay.style.display = 'none';
            fullscreenImg.src = '';
        }
    });
</script>

</body>
</html>
