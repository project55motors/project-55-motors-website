<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Traffic Analytics – Project 55 Motors</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="styles.css">

    <style>
        /* Reuse admin theme from dashboard for consistency */

        :root {
            --admin-bg: #f4f6fa;
            --admin-bg-dark: #0b1220;
            --admin-card: #ffffff;
            --admin-card-dark: #111827;
            --admin-accent: #1a5fff;
            --admin-border: #d0d7e2;
            --admin-text: #111827;
            --admin-text-soft: #4b5563;
            --admin-text-muted: #6b7280;
        }

        .admin-dark {
            --admin-bg: var(--admin-bg-dark);
            --admin-card: var(--admin-card-dark);
            --admin-border: #1f2937;
            --admin-text: #f9fafb;
            --admin-text-soft: #d1d5db;
            --admin-text-muted: #9ca3af;
        }

        body.admin-shell {
            margin: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: var(--admin-bg);
            color: var(--admin-text);
        }

        .admin-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 32px;
            border-bottom: 1px solid var(--admin-border);
            background: linear-gradient(120deg, #020617, #0f172a);
            color: #f9fafb;
        }

        .admin-header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .admin-brandmark {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .admin-brandmark img {
            height: 38px;
            border-radius: 8px;
            background: #020617;
            padding: 4px 8px;
        }

        .admin-brandtext {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .admin-brandtext span:first-child {
            font-size: 18px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .admin-brandtext span:last-child {
            font-size: 12px;
            color: #9ca3af;
        }

        .admin-header-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .admin-btn {
            border-radius: 999px;
            border: 1px solid var(--admin-border);
            padding: 6px 12px;
            font-size: 13px;
            background: var(--admin-card);
            color: var(--admin-text-soft);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .admin-btn-primary {
            background: var(--admin-accent);
            border-color: var(--admin-accent);
            color: #f9fafb;
        }

        .admin-main {
            padding: 18px 24px 32px;
        }

        .traffic-grid {
            display: grid;
            grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr);
            gap: 18px;
        }

        .traffic-card {
            background: var(--admin-card);
            border-radius: 18px;
            border: 1px solid var(--admin-border);
            padding: 18px 20px;
            box-shadow: 0 16px 40px rgba(15, 23, 42, 0.15);
        }

        .traffic-card h2 {
            margin: 0 0 6px 0;
            font-size: 18px;
        }

        .traffic-card p {
            margin: 0 0 10px 0;
            font-size: 13px;
            color: var(--admin-text-muted);
        }

        .traffic-summary-row {
            display: flex;
            gap: 14px;
            margin-top: 10px;
        }

        .traffic-summary-pill {
            flex: 1;
            padding: 10px 12px;
            border-radius: 12px;
            border: 1px solid var(--admin-border);
            background: rgba(15, 23, 42, 0.02);
            font-size: 13px;
        }

        .traffic-summary-pill span {
            display: block;
        }

        .traffic-summary-pill span.label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--admin-text-muted);
            margin-bottom: 2px;
        }

        table.traffic-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }

        table.traffic-table th,
        table.traffic-table td {
            border-bottom: 1px solid var(--admin-border);
            padding: 6px 6px;
            text-align: left;
        }

        table.traffic-table th {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .traffic-bar {
            height: 8px;
            border-radius: 999px;
            background: #e5e7eb;
            overflow: hidden;
        }

        .traffic-bar-inner {
            height: 100%;
            background: #1a5fff;
        }

        @media (max-width: 900px) {
            .traffic-grid {
                grid-template-columns: minmax(0, 1fr);
            }
            .admin-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }
        }
    </style>
</head>
<body class="admin-shell">
<header class="admin-header">
    <div class="admin-header-left">
        <div class="admin-brandmark">
            <img src="logo.png" alt="Project 55 Motors logo">
            <div class="admin-brandtext">
                <span>PROJECT 55 MOTORS</span>
                <span>Traffic &amp; Analytics</span>
            </div>
        </div>
    </div>
    <div class="admin-header-right">
        <button type="button" class="admin-btn" onclick="window.location.href='admin-dashboard.html'">
            ← Back to Stock
        </button>
    </div>
</header>

<main class="admin-main">
    <section class="traffic-grid">
        <article class="traffic-card">
            <h2>Traffic Summary</h2>
            <p>High-level view of visits across your public site.</p>
            <div id="traffic-summary">
                <!-- Filled by admin-traffic.js -->
            </div>
        </article>

        <article class="traffic-card">
            <h2>Top Pages</h2>
            <p>Most visited pages (recent window).</p>
            <table class="traffic-table" id="traffic-top-pages">
                <thead>
                <tr>
                    <th>Page</th>
                    <th>Hits</th>
                    <th style="width:40%;">Share</th>
                </tr>
                </thead>
                <tbody></tbody>
            </table>
        </article>

        <article class="traffic-card">
            <h2>Daily Visits</h2>
            <p>Recent days of traffic across the whole site.</p>
            <table class="traffic-table" id="traffic-daily">
                <thead>
                <tr>
                    <th>Date</th>
                    <th>Hits</th>
                    <th style="width:40%;">Trend</th>
                </tr>
                </thead>
                <tbody></tbody>
            </table>
        </article>
    </section>
</main>

<script src="admin-traffic.js"></script>
</body>
</html>
