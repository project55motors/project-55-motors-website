<!-- P55 Admin shortcut: long-press hero banner (iOS-friendly) -->
<script>
(function(){
  const ADMIN_URL = "/admin-dashboard";
  const HOLD_MS = 2100; // ~2+ seconds
  const hero = document.querySelector(".hero-banner");
  if (!hero || !hero.parentNode) return;

  // Remove any previously-attached listeners on the hero banner (e.g. modal shortcuts)
  const clone = hero.cloneNode(true);
  hero.parentNode.replaceChild(clone, hero);

  let timer = null;
  let startX = 0, startY = 0;

  function pointFromEvent(e){
    if (e.touches && e.touches[0]) return e.touches[0];
    return e;
  }

  function start(e){
    const p = pointFromEvent(e);
    startX = p.clientX; startY = p.clientY;
    if (timer) clearTimeout(timer);
    timer = setTimeout(function(){
      window.location.href = ADMIN_URL;
    }, HOLD_MS);
  }

  function move(e){
    if (!timer) return;
    const p = pointFromEvent(e);
    if (Math.abs(p.clientX - startX) > 12 || Math.abs(p.clientY - startY) > 12) {
      clearTimeout(timer);
      timer = null;
    }
  }

  function end(){
    if (timer) {
      clearTimeout(timer);
      timer = null;
    }
  }

  // Touch (iOS / mobile)
  clone.addEventListener("touchstart", start, { passive: true });
  clone.addEventListener("touchmove",  move,  { passive: true });
  clone.addEventListener("touchend",   end,   { passive: true });
  clone.addEventListener("touchcancel",end,   { passive: true });

  // Mouse (desktop)
  clone.addEventListener("mousedown", start);
  clone.addEventListener("mousemove", move);
  clone.addEventListener("mouseup", end);
  clone.addEventListener("mouseleave", end);
})();
</script>
