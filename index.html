<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project 55 Motors – Premium Used Cars</title>

    <link rel="stylesheet" href="styles.css" />
</head>
<body>

    <!-- HERO HEADER -->
    <header class="hero-header">
        <img src="assets/hero-banner.jpg" alt="Shropshire Hills" class="hero-banner">
        <img src="logo.png" alt="Project 55 Motors" class="hero-logo">
    </header>

    <!-- NAVIGATION -->
    <nav class="main-nav">
        <a href="index.html" class="active">Home</a>
        <a href="inventory.html">Current Stock</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
    </nav>

    <!-- MAIN CONTENT -->
    <main class="page-wrapper">

        <!-- HEADLINE AREA -->
        <h1 class="homepage-title">Premium Used Cars</h1>
        <p class="homepage-sub">Quality, reliability and transparency – every vehicle prepared to a high standard.</p>

        <!-- FEATURED VEHICLES -->
        <section class="featured-section">
            <h2 class="section-title">Featured Vehicles</h2>

            <div id="car-grid" class="car-grid"></div>
        </section>

        <!-- CTA -->
        <div class="cta-box">
            <a href="inventory.html" class="btn-primary">View All Vehicles</a>
        </div>

    </main>

    <!-- FOOTER -->
    <footer>
        © 2025 Project 55 Motors – South Shropshire. All rights reserved.
    </footer>


    <!-- 🔐 HIDDEN ADMIN LOGIN MODAL -->
    <div id="admin-login-modal" class="modal">
        <div class="modal-content">
            <span class="modal-close">&times;</span>
            <h2>Staff Login</h2>

            <form id="admin-login-form">
                <input type="text" name="username" placeholder="Username" required>
                <input type="password" name="password" placeholder="Password" required>
                <button type="submit">Log In</button>
            </form>

            <p id="admin-login-error" style="color:red; display:none;"></p>
        </div>
    </div>


    <!-- SCRIPTS -->
    <script src="cars.js"></script>
    <script src="admin-shortcut.js"></script>

</body>
</html>
