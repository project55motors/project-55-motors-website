<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project 55 Motors – Premium Used Cars</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="hero-header">
    <img src="assets/hero-banner.png" alt="Web banner" class="hero-banner">
</header>

<nav class="main-nav">
    <div class="main-nav-inner">
        <a href="index.html" class="active">Home</a>
        <a href="inventory.html">Current Stock</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
    </div>

<main class="page-wrapper">
    <h1 class="page-title">Featured Vehicles</h1>
    <p class="page-intro">
        Carefully selected, well-maintained used cars prepared to a high standard in South Shropshire.
    </p>

    <div id="car-grid" class="car-grid"></div>

<!-- Staff login modal -->
<div id="adminLoginModal" class="modal">
    <div class="modal-content">
        <span class="modal-close" onclick="closeAdminModal()">×</span>
        <h2>Staff Login</h2>

        <form onsubmit="submitAdminLogin(event)">
            <input id="adminUser" type="text" placeholder="Username" required>
            <input id="adminPass" type="password" placeholder="Password" required>
            <button type="submit" class="modal-login-btn">Log In</button>
        </form>

        <p id="admin-login-error" class="modal-error"></p>
    </div>
</div>

<script src="cars.js"></script>
<script src="admin-shortcut.js"></script>
</body>
</html>
