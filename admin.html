<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin – Project 55 Motors</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

<!-- HERO -->
<header class="hero-header">
    <img src="assets/hero-banner.jpg" alt="" class="hero-banner">
    <img src="logo.png" alt="Project 55 Motors" class="hero-logo">
</header>

<!-- NAV -->
<nav class="main-nav">
    <a href="index.html">Home</a>
    <a href="inventory.html">Current Stock</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
    <a href="admin.html" class="active">Admin</a>
</nav>

<!-- ADMIN CONTENT -->
<main class="page-wrapper">
    <h1>Admin Access</h1>
    <p>This page is restricted. To continue, use the login shortcut.</p>
    <p style="opacity:0.6; font-size:14px;">
        (Shift + A or triple-tap logo)
    </p>
</main>

<footer>
    © 2025 Project 55 Motors – South Shropshire. All rights reserved.
</footer>


<!-- 🔐 LOGIN MODAL -->
<div id="admin-login-modal" class="modal">
    <div class="modal-content">
        <span class="modal-close">×</span>
        <h2>Staff Login</h2>

        <form id="admin-login-form">
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit" class="login-btn">Log In</button>
        </form>

        <p id="admin-login-error" style="display:none; color:red;"></p>
    </div>
</div>


<!-- SCRIPTS -->
<script src="admin-shortcut.js"></script>

<script>
    // Automatically redirect if already logged in (cookie present)
    fetch("/login-check", { credentials: "include" })
        .then(res => res.json())
        .then(data => {
            if (data?.loggedIn === true) {
                window.location.href = "admin-dashboard.html";
            }
        });
</script>

</body>
</html>
