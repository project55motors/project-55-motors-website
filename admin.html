<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project 55 Motors Admin</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .admin-wrapper {
            text-align: center;
            margin-top: 60px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.75);
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .modal-content {
            background: #fff;
            padding: 30px;
            width: 350px;
            border-radius: 12px;
            position: relative;
            text-align: center;
            box-shadow: 0px 4px 18px rgba(0,0,0,0.2);
        }

        .modal-content h2 {
            margin-bottom: 15px;
        }

        .modal-content input {
            width: 90%;
            padding: 10px;
            margin-bottom: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        .close-btn {
            position: absolute;
            top: 10px;
            right: 12px;
            font-size: 20px;
            cursor: pointer;
        }

        .login-btn {
            background: #1a1a1a;
            color: white;
            padding: 12px;
            width: 95%;
            border: none;
            cursor: pointer;
            border-radius: 6px;
            font-size: 16px;
        }

        footer {
            margin-top: 120px;
            opacity: 0.7;
            font-size: 14px;
        }
    </style>
</head>
<body>

<header class="hero-header">
    <img src="assets/hero-banner.jpg" class="hero-banner" alt="">
    <img src="logo.png" class="hero-logo" alt="Project 55 Motors">
</header>

<nav class="main-nav">
    <a href="index.html">Home</a>
    <a href="inventory.html">Current Stock</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
    <a class="active" href="admin.html">Admin</a>
</nav>

<div class="admin-wrapper">
    <h1>Project 55 Motors Admin</h1>
    <p style="opacity:0.6">Please log in to continue</p>
</div>

<!-- LOGIN MODAL -->
<div id="adminModal" class="modal">
    <div class="modal-content">
        <span class="close-btn" onclick="closeModal()">×</span>
        <h2>Admin Login</h2>
        <input type="password" id="adminPassword" placeholder="Enter admin password">
        <button class="login-btn" onclick="submitLogin()">Login</button>
    </div>
</div>

<footer>
    © 2025 Project 55 Motors – South Shropshire. All rights reserved.
</footer>

<script src="admin-shortcut.js"></script>

<script>
    // Always open modal automatically on this page
    setTimeout(() => {
        document.getElementById("adminModal").style.display = "flex";
    }, 400);

    function closeModal() {
        document.getElementById("adminModal").style.display = "none";
    }

    function submitLogin() {
        const pwd = document.getElementById("adminPassword").value;
        if (pwd.trim() !== "") {
            sessionStorage.setItem("admin_session", "active");
            window.location.href = "admin-dashboard.html";
        } else {
            alert("Please enter a password.");
        }
    }

    // ESC closes modal
    document.addEventListener("keydown", function(e) {
        if (e.key === "Escape") {
            closeModal();
        }
    });
</script>

</body>
</html>
