<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login – Project 55 Motors</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    /* Modal styling */
    #admin-login-modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10000;
    }
    #admin-login-modal .modal-content {
      background: #fff;
      padding: 2rem;
      border-radius: 12px;
      max-width: 400px;
      width: 90%;
    }
    #admin-login-modal input {
      width: 100%;
      padding: 0.8rem;
      margin-bottom: 1rem;
      border-radius: 8px;
      border: 1px solid #ccc;
    }
    #admin-login-modal button {
      width: 100%;
      padding: 0.8rem;
      border-radius: 8px;
      background: #0066cc;
      color: #fff;
      font-weight: 600;
      border: none;
      cursor: pointer;
    }
    #admin-login-error {
      color: red;
      display: none;
      margin-top: 0.5rem;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

<h1 style="text-align:center; margin-top:2rem;">Project 55 Motors Admin</h1>
<p style="text-align:center;">Press Shift + A to open admin login.</p>

<!-- Admin Modal -->
<!-- Admin Login Modal (hidden by default) -->
<div id="admin-login-modal" class="modal" style="display:none;">
  <div class="modal-content">
    <span class="modal-close">×</span>

    <h2 style="text-align:center;">Staff Login</h2>

    <form id="admin-login-form" style="text-align:left;">
      <input type="text" name="username" placeholder="Username" required class="form-field">
      <input type="password" name="password" placeholder="Password" required class="form-field">
      <button type="submit" class="cta" style="width:100%;">Log In</button>
    </form>

    <p id="admin-login-error"
       style="color:red; text-align:center; margin-top:1rem; display:none;">
    </p>
  </div>
</div>

<script src="admin-shortcut.js"></script>
</body>
</html>
