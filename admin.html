<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login – Project 55 Motors</title>
    <link rel="stylesheet" href="styles.css">

    <style>
        body {
            text-align: center;
            padding: 0;
            margin: 0;
        }

        .admin-subtext {
            font-size: 0.85rem;
            color: #6f6f6f;
            margin-bottom: 20px;
        }

        /* MODAL */
        .admin-modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.45);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .admin-modal {
            width: 350px;
            background: white;
            border-radius: 14px;
            padding: 30px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.22);
            animation: fadeIn 0.25s ease;
            position: relative;
        }

        .admin-modal-close {
            position: absolute;
            top: 10px;
            right: 12px;
            cursor: pointer;
            font-size: 20px;
            color: #666;
        }

        .admin-modal input {
            width: 100%;
            padding: 10px 12px;
            margin: 6px 0 15px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 1rem;
        }

        .admin-login-btn {
            width: 100%;
            padding: 12px;
            background: #111;
            color: white;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-size: 1rem;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.96); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>

</head>

<body>

    <!-- HERO -->
    <header class="hero-header">
        <img src="assets/hero-banner.jpg" alt="Shropshire Banner" class="hero-banner">
        <img src="logo.png" alt="Project 55 Motors" class="hero-logo" id="adminLogo">
    </header>

    <nav class="main-nav">
        <a href="index.html">Home</a>
        <a href="inventory.html">Current Stock</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
    </nav>

    <main style="padding: 50px 20px;">
        <h1>Project 55 Motors Admin</h1>
        <p class="admin-subtext">(Press <strong>Shift + A</strong> or triple-tap the logo to open login)</p>
    </main>

    <!-- 🔐 LOGIN MODAL -->
    <div class="admin-modal-overlay" id="adminLoginModal">
        <div class="admin-modal">
            <div class="admin-modal-close" id="closeAdminModal">✕</div>
            <h2 style="margin-bottom:20px;">Admin Access</h2>

            <input type="password" id="adminPassword" placeholder="Enter password...">

            <button class="admin-login-btn" onclick="attemptLogin()">Login</button>
        </div>
    </div>

    <footer>
        © 2025 Project 55 Motors — South Shropshire. All rights reserved.
    </footer>

    <script src="admin-shortcut.js"></script>

<script>
function openAdminModal() {
    document.getElementById("adminLoginModal").style.display = "flex";
    document.getElementById("adminPassword").focus();
}

function closeAdminModal() {
    document.getElementById("adminLoginModal").style.display = "none";
}

document.getElementById("closeAdminModal").onclick = closeAdminModal;

document.addEventListener("keydown", e => {
    if (e.key === "Escape") closeAdminModal();
});

function attemptLogin() {
    const pw = document.getElementById("adminPassword").value.trim();

    if (!pw) return alert("Please enter the admin password.");

    // Redirect after successful entry (same logic as before)
    window.location.href = "admin-dashboard.html?auth=true";
}
</script>

</body>
</html>
