<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin – Project 55 Motors</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="admin-container" id="admin-container" style="display:none;">
    <h1 style="text-align:center;">Admin Login</h1>

    <form id="admin-login" style="max-width:400px;margin:2rem auto;text-align:left;">
        <label for="username">Username</label>
        <input type="text" id="username" class="form-field" required>

        <label for="password">Password</label>
        <input type="password" id="password" class="form-field" required>

        <button type="submit" class="cta" style="width:100%;">Login</button>
    </form>

    <div id="admin-content" style="display:none; margin-top:2rem;">
        <h2>Welcome, Admin!</h2>
        <p>Here is the current stock from Airtable:</p>

        <table id="cars-table" style="width:100%; border-collapse:collapse;">
            <thead>
                <tr>
                    <th>Registration</th>
                    <th>Make & Model</th>
                    <th>Mileage</th>
                    <th>MOT</th>
                    <th>Price</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody>
                <!-- Filled dynamically -->
            </tbody>
        </table>

        <h3 style="margin-top:2rem;">Customer Reservations</h3>
        <table id="reservations-table" style="width:100%; border-collapse:collapse;">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Car Registration</th>
                    <th>Message</th>
                    <th>Date</th>
                </tr>
            </thead>
            <tbody>
                <!-- Filled dynamically -->
            </tbody>
        </table>
    </div>
</div>

<script src="admin-shortcut.js"></script>
<script src="admin-worker.js"></script>

</body>
</html>
