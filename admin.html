<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin – Project 55 Motors</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- HERO HEADER -->
    <header class="hero-header">
        <img src="assets/hero-banner.jpg" class="hero-banner" alt="Shropshire Hills">
        <img src="logo.png" class="hero-logo" alt="Project 55 Motors">
    </header>

    <!-- NAVIGATION -->
    <nav class="main-nav">
        <a href="index.html">Home</a>
        <a href="inventory.html">Current Stock</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
        <a class="active" href="admin.html">Admin</a>
    </nav>

    <main class="page-wrapper">
        <h1 class="page-title">Staff Access</h1>
        <p class="page-intro">Press <strong>Shift + A</strong> or triple-tap the logo to sign in.</p>
    </main>

    <!-- FOOTER -->
    <footer>
        © 2025 Project 55 Motors – South Shropshire. All rights reserved.
    </footer>


    <!-- 🔐 HIDDEN STAFF LOGIN MODAL -->
    <div id="admin-login-modal" class="modal">
        <div class="modal-content">
            <span class="modal-close">&times;</span>
            <h2>Admin Login</h2>

            <form id="admin-login-form">
                <input type="text" name="username" placeholder="Username" required>
                <input type="password" name="password" placeholder="Password" required>
                <button type="submit">Log In</button>
            </form>

            <p id="admin-login-error" style="color:red; display:none;"></p>
        </div>
    </div>

    <!-- SCRIPTS -->
    <script src="admin-shortcut.js"></script>

</body>
</html>
