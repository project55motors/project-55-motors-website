<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project 55 Motors Admin</title>
    <link rel="stylesheet" href="styles.css">
    <!-- (Keep the same styles as before) -->
</head>
<body>

<header class="hero-header">
    <img src="assets/hero-banner.jpg" class="hero-banner" alt="">
    <img src="logo.png" class="hero-logo" alt="Project 55 Motors">
</header>

<nav class="main-nav">
    <a href="index.html">Home</a>
    <a href="inventory.html">Current Stock</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
    <a class="active" href="admin.html">Admin</a>
</nav>

<div class="admin-wrapper">
    <h1>Project 55 Motors Admin</h1>
    <p style="opacity:0.6">Please log in to continue</p>
</div>

<!-- LOGIN MODAL with Username and Password -->
<div id="adminModal" class="modal">
    <div class="modal-content">
        <span class="close-btn" onclick="closeModal()">×</span>
        <h2>Admin Login</h2>
        <input type="text" id="adminUsername" placeholder="Enter admin username" required>
        <input type="password" id="adminPassword" placeholder="Enter admin password" required>
        <button class="login-btn" onclick="submitLogin()">Login</button>
    </div>
</div>

<footer>
    © 2025 Project 55 Motors – South Shropshire. All rights reserved.
</footer>

<script src="admin-shortcut.js"></script>

<script>
    // Always open modal automatically on this page
    setTimeout(() => {
        document.getElementById("adminModal").style.display = "flex";
    }, 400);

    function closeModal() {
        document.getElementById("adminModal").style.display = "none";
    }

    async function submitLogin() {
        const username = document.getElementById("adminUsername").value.trim();
        const password = document.getElementById("adminPassword").value.trim();

        // Send the username/password to your Cloudflare Worker for verification
        const response = await fetch('/api/verify-login', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ username, password })
        });

        const result = await response.json();

        if (result.success) {
            // Store session on success
            sessionStorage.setItem("admin_username", username);
            sessionStorage.setItem("admin_session", "active");
            // Redirect to the dashboard
            window.location.href = "admin-dashboard.html";
        } else {
            alert("Incorrect username or password.");
        }
    }

    // ESC closes modal
    document.addEventListener("keydown", function(e) {
        if (e.key === "Escape") {
            closeModal();
        }
    });
</script>

</body>
</html>
