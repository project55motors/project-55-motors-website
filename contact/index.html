<script>
  // Pre-fill from ?msg= in query string
  const params = new URLSearchParams(window.location.search);
  const preMsg = params.get("msg");
  if (preMsg) {
    const msgField = document.getElementById("message");
    if (msgField) msgField.value = preMsg;
  }

  // Premium: support structured pre-fill from vehicle pages
  // Usage: /contact?vehicle=Fiat%20500%20Lounge&reg=WO21%20KZU&url=https%3A%2F%2Fproject55motors.co.uk%2Fvehicle%3Fid%3D...
  const vehicle = params.get("vehicle");
  const reg = params.get("reg");
  const sourceUrl = params.get("url");

  if (vehicle || reg || sourceUrl) {
    const msgField = document.getElementById("message");
    const lines = [];
    if (vehicle) lines.push(`Vehicle: ${vehicle}`);
    if (reg) lines.push(`Registration: ${reg}`);
    if (sourceUrl) lines.push(`Link: ${sourceUrl}`);
    const header = lines.join(" | ");

    // Add hidden fields so the email contains structured context
    const form = document.getElementById("contactForm");
    if (form) {
      if (vehicle) {
        const i = document.createElement("input");
        i.type = "hidden"; i.name = "vehicle"; i.value = vehicle;
        form.appendChild(i);
      }
      if (reg) {
        const i = document.createElement("input");
        i.type = "hidden"; i.name = "registration"; i.value = reg;
        form.appendChild(i);
      }
      if (sourceUrl) {
        const i = document.createElement("input");
        i.type = "hidden"; i.name = "vehicle_link"; i.value = sourceUrl;
        form.appendChild(i);
      }
    }

    // Prepend to message if it's empty or doesn't already include it
    if (msgField) {
      const existing = (msgField.value || "").trim();
      if (!existing || !existing.includes("Vehicle:")) {
        msgField.value = header + "\n\n" + existing;
      }
    }
  }
</script>
