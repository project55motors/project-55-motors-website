  <main class="page-wrapper">
    <h1 class="page-title">Contact</h1>
    <p class="page-intro">To arrange a viewing, discuss a vehicle or ask a question, please use the form below. We aim to respond promptly.</p>

    <form action="https://formsubmit.co/4f494987fba30d06e09c30445899cf4c" method="POST" class="contact-form" id="contactForm">
      <label for="name">Your Name</label>
      <input id="name" type="text" name="name" required />

      <label for="email">Email Address</label>
      <input id="email" type="email" name="email" required />

      <label for="phone">Phone Number</label>
      <input id="phone" type="tel" name="phone" />

      <label for="message">Your Message</label>
      <textarea id="message" name="message" required></textarea>

      <button type="submit" class="btn-primary">Send Message</button>
    </form>
  </main>
