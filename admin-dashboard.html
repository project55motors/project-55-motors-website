<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project 55 Motors | Admin Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
body {
  margin:0;
  font-family: Inter, system-ui, sans-serif;
  background:#f7f8fb;
  color:#111827;
}

header {
  text-align:center;
  padding:40px 20px 20px;
}

h1 {
  margin-bottom:6px;
}

p {
  color:#6b7280;
}

button {
  cursor:pointer;
  border:none;
  border-radius:6px;
  padding:8px 12px;
  font-weight:600;
}

.btn {
  background:#2563eb;
  color:white;
}

.btn:hover { background:#1d4ed8; }

.btn-sold {
  background:#111827;
  margin-top:6px;
}

.btn-save {
  background:#16a34a;
}

#addBtn {
  margin:10px auto 15px;
  display:block;
  padding:10px 18px;
  font-size:15px;
}

.container {
  max-width:1400px;
  margin:0 auto;
  padding:20px;
}

.alert {
  padding:12px 16px;
  border-radius:8px;
  margin-bottom:15px;
}

.alert.error {
  background:#fef2f2;
  color:#991b1b;
}

.table-wrapper {
  background:white;
  border-radius:16px;
  padding:15px;
  box-shadow: 0 15px 40px rgba(0,0,0,0.05);
  overflow-x:auto;
}

table {
  width:100%;
  border-collapse: collapse;
  table-layout: fixed;
}

thead {
  background:#1e40af;
  color:white;
}

th {
  padding:12px 10px;
  font-size:14px;
}

td {
  padding:10px;
  vertical-align:top;
  border-bottom:1px solid #e5e7eb;
}

td input,
td textarea,
td select {
  width:100%;
  max-width:100%;
  padding:6px;
  font-size:13px;
  border-radius:6px;
  border:1px solid #d1d5db;
  box-sizing:border-box;
}

textarea {
  min-height:60px;
}

img.photo-thumb {
  width:90px;
  height:60px;
  object-fit:cover;
  border-radius:6px;
}

.actions{
  white-space:nowrap;
}

#status {
  display:none;
}
</style>
</head>

<body>

<header>
  <h1>Project 55 Motors · Admin Dashboard</h1>
  <p>Full inline editing • Never open Ai
