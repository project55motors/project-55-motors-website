<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard – Project 55 Motors</title>
    <link rel="stylesheet" href="styles.css">
    <style>

        .dash-wrapper {
            max-width: 1200px;
            margin: auto;
            padding: 40px;
        }

        .dash-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        button.logout {
            background: #b30000;
            padding: 10px 14px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            color: white;
        }

        table {
            width: 100%;
            margin-top: 30px;
            border-collapse: collapse;
        }

        table th {
            background: #f2f2f2;
            padding: 10px;
            text-align: left;
        }

        table td {
            padding: 8px;
            border-bottom: 1px solid #ccc;
        }

        textarea {
            height: 60px;
            resize: vertical;
        }

        .photo-thumb {
            width: 90px;
            height: 60px;
            object-fit: cover;
            border-radius: 6px;
        }

        .btn-save, .btn-sold {
            width: 100%;
            margin-top: 6px;
            cursor: pointer;
            border-radius: 6px;
            border: none;
            padding: 6px;
        }

        .btn-save {
            background: #1a1a1a;
            color: white;
        }

        .btn-sold {
            background: #444;
            color: white;
        }

        .create-btn {
            margin-top: 10px;
            background: #0078ff;
            color: white;
            border: none;
            padding: 10px 14px;
            cursor: pointer;
            border-radius: 6px;
        }

    </style>
</head>

<body>

<header class="hero-header">
    <img src="assets/hero-banner.jpg" class="hero-banner" alt="">
    <img src="logo.png" class="hero-logo" alt="Project 55 Motors">
</header>

<nav class="main-nav">
    <a href="index.html">Home</a>
    <a href="inventory.html">Current Stock</a>
    <a href="admin.html" class="active">Admin</a>
</nav>

<main class="dash-wrapper">

    <div class="dash-header">
        <h1>Vehicle Inventory Manager</h1>
        <button class="logout" onclick="logout()">Logout</button>
    </div>

    <button class="create-btn" onclick="createCar()">+ Add New Vehicle</button>

    <table>
        <thead>
            <tr>
                <th>Photo</th>
                <th>Make/Model</th>
                <th>Registration</th>
                <th>Price</th>
                <th>Mileage</th>
                <th>MOT</th>
                <th>Status</th>
                <th>Short Description</th>
                <th>Full Description</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="admin-table"></tbody>
    </table>

</main>


<script>
async function loadTable() {
    const res = await fetch("/admin/all", { credentials: "include" });

    if (!res.ok) {
        alert("Authentication failed.");
        window.location.href = "admin.html";
        return;
    }

    document.getElementById("admin-table").innerHTML = await res.text();
}

async function save(id) {
    const row = document.querySelector(`tr[data-id="${id}"]`);
    const fields = {};

    row.querySelectorAll("input, select, textarea").forEach(el => {
        fields[el.name] = el.value;
    });

    await fetch("/admin/update", {
        method: "POST",
        credentials: "include",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id, fields })
    });

    alert("Saved.");
}

async function sold(id) {
    await fetch("/admin/update", {
        method: "POST",
        credentials: "include",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id, fields: { Status: "Sold" } })
    });

    loadTable();
}

async function createCar() {
    await fetch("/admin/create", {
        method: "POST",
        credentials: "include"
    });

    loadTable();
}

async function logout() {
    await fetch("/logout", {
        method: "POST",
        credentials: "include"
    });

    window.location.href = "admin.html";
}

loadTable();
</script>

</body>
</html>
