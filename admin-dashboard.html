<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Dashboard – Project 55 Motors</title>

  <link rel="stylesheet" href="/styles.css?v=20260117b" />

  <!-- Admin-only scoped styles -->
  <style>
    body.admin-body { background:#050b18; color:#fff; }
    body.admin-body .admin-desc-cell{ position:relative; }
    body.admin-body .admin-cell-textarea{
      width:100%;
      border:1px solid rgba(255,255,255,0.14);
      background:rgba(0,0,0,0.22);
      color:rgba(255,255,255,0.92);
      border-radius:12px;
      padding:9px 10px;
      outline:none;
      font:inherit;
      line-height:1.35;
      resize:vertical;
    }
    body.admin-body .admin-cell-textarea:focus{
      border-color:rgba(26,95,255,0.60);
      box-shadow:0 0 0 4px rgba(26,95,255,0.16);
    }
  </style>
</head>

<body class="admin-body">

<header class="admin-header">
  <div class="admin-header-inner">

    <div class="admin-brand">
      <div class="admin-mark">PROJECT 55 MOTORS</div>
      <div class="admin-sub">Staff Portal</div>
    </div>

    <!-- FIXED: no nocache parameter -->
    <a class="admin-home-logo"
       href="/index.html"
       title="Open website"
       aria-label="Open Project 55 Motors website">
      <img src="/logo.png" alt="Project 55 Motors" />
    </a>

    <div class="admin-actions">
      <button class="admin-btn ghost admin-logout" id="logoutBtn" style="display:none">
        Log out
      </button>
    </div>

  </div>

  <nav class="admin-tabs" id="adminTabs" style="display:none">
    <button class="admin-tab is-active" data-view="stock">Stock</button>
    <button class="admin-tab" data-view="analytics">Analytics</button>
    <button class="admin-tab" data-view="settings">Settings</button>
  </nav>
</header>

<main class="admin-main">

  <!-- LOGIN -->
  <section id="loginModal" class="admin-card" style="display:none">
    <h2 class="admin-h2">Staff Login</h2>
    <div class="admin-form">
      <label class="admin-label">Username</label>
      <input class="admin-input" id="username" autocomplete="username" />

      <label class="admin-label">Password</label>
      <input class="admin-input" id="password" type="password" autocomplete="current-password" />

      <button class="admin-btn primary" id="loginBtn" type="button">Log in</button>
      <div class="admin-note">Access is restricted to authorised staff.</div>
    </div>
  </section>

  <!-- DASHBOARD -->
  <section id="dashboard" style="display:none">

    <!-- STOCK -->
    <section id="stockView" class="admin-view">
      <div class="admin-view-head">
        <h2 class="admin-h2">Stock Overview</h2>
        <div class="admin-view-actions">
          <div class="admin-filters" id="stockFilters"></div>
        </div>
      </div>

      <div class="admin-table-wrap">
        <table class="admin-table">
          <thead>
            <tr>
              <th>Vehicle</th>
              <th>Price</th>
              <th>Status</th>
              <th>Mileage</th>
              <th>Engine</th>
              <th>Fuel</th>
              <th>MOT</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="stockTableBody"></tbody>
        </table>
      </div>
    </section>

    <!-- ANALYTICS -->
    <section id="analyticsView" class="admin-view" style="display:none">
      <h2 class="admin-h2">Analytics</h2>
      <div id="analyticsContent"></div>
    </section>

    <!-- SETTINGS -->
    <section id="settingsView" class="admin-view" style="display:none">
      <h2 class="admin-h2">Settings</h2>
      <p>Additional configuration options will appear here.</p>
    </section>

  </section>

</main>

<!-- JS -->
<script src="/site-config.js?v=20260117b"></script>
<script src="/admin-dashboard.js?v=20260121a"></script>

</body>
</html>
