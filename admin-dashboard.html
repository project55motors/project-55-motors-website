<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Admin Dashboard – Project 55 Motors</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      margin: 0;
      background: #f6f7fb;
    }

    header {
      padding: 16px 24px;
      background: #fff;
      border-bottom: 1px solid #ddd;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    h1 { margin: 0; }

    main { padding: 24px; }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 6px;
      vertical-align: top;
    }

    th {
      background: #f0f0f0;
      text-align: left;
    }

    input, select, textarea {
      width: 100%;
      box-sizing: border-box;
      font-size: 13px;
    }

    textarea { min-height: 60px; }

    .admin-thumb {
      width: 90px;
      height: auto;
      border-radius: 4px;
    }

    button {
      padding: 4px 8px;
      font-size: 13px;
      cursor: pointer;
    }

    /* ===== LOGIN MODAL ===== */
    #loginOverlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    #loginBox {
      background: #fff;
      padding: 24px;
      border-radius: 12px;
      width: 320px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.25);
    }

    #loginBox h2 {
      margin-top: 0;
    }

    #loginBox input {
      margin-bottom: 12px;
    }
  </style>
</head>
<body>

<header>
  <h1>PROJECT 55 MOTORS</h1>
  <button onclick="logout()">LOG OUT</button>
</header>

<main>
  <h2>STOCK OVERVIEW</h2>

  <table>
    <thead>
      <tr>
        <th>Photo</th>
        <th>Make / Model</th>
        <th>Registration</th>
        <th>Price</th>
        <th>Mileage</th>
        <th>MOT Date</th>
        <th>Engine</th>
        <th>Fuel</th>
        <th>Transmission</th>
        <th>Status</th>
        <th>Short Description</th>
        <th>Full Description</th>
        <th>Order / Actions</th>
      </tr>
    </thead>
    <tbody id="stockBody"></tbody>
  </table>
</main>

<!-- LOGIN MODAL -->
<div id="loginOverlay">
  <div id="loginBox">
    <h2>Staff Login</h2>
    <input id="username" placeholder="Username" />
    <input id="password" type="password" placeholder="Password" />
    <button onclick="login()">LOG IN</button>
  </div>
</div>

<script src="admin-dashboard.js"></script>
</body>
</html>
