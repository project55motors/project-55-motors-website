<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Admin Dashboard – Project 55 Motors</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="styles.css" />
  <style>
    body { margin:0; font-family: system-ui, -apple-system, BlinkMacSystemFont; }
    #login-modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.45);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }
    #login-box {
      background: #fff;
      width: 360px;
      padding: 28px;
      border-radius: 14px;
      box-shadow: 0 20px 50px rgba(0,0,0,.25);
    }
    #login-box h2 { margin-top:0; }
    #login-box input {
      width:100%;
      padding:10px;
      margin:6px 0 14px;
      font-size:16px;
    }
    #login-error { color:#c00; font-size:14px; display:none; }
    #app { display:none; }
    button { cursor:pointer; }
  </style>
</head>

<body>

<!-- LOGIN MODAL -->
<div id="login-modal">
  <div id="login-box">
    <h2>STAFF LOGIN</h2>
    <p style="font-size:14px;color:#666">
      Internal use only. Changes update live stock.
    </p>

    <label>Username</label>
    <input id="login-user" autocomplete="username" />

    <label>Password</label>
    <input id="login-pass" type="password" autocomplete="current-password" />

    <div id="login-error">Invalid login</div>

    <button id="login-btn">LOG IN</button>
  </div>
</div>

<!-- APP -->
<div id="app">
  <header style="padding:20px;display:flex;align-items:center;gap:16px">
    <img src="logo.png" height="36" />
    <strong>PROJECT 55 MOTORS</strong>
    <div style="margin-left:auto">
      <button id="logout-btn">LOG OUT</button>
    </div>
  </header>

  <main style="padding:20px">
    <h2>STOCK OVERVIEW</h2>
    <table border="1" cellpadding="6" cellspacing="0" width="100%">
      <thead>
        <tr>
          <th>Photo</th>
          <th>Make / Model</th>
          <th>Reg</th>
          <th>Price</th>
          <th>Mileage</th>
          <th>MOT</th>
          <th>Fuel</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="admin-table-body"></tbody>
    </table>
  </main>
</div>

<script src="admin-dashboard.js"></script>
</body>
</html>
