<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard – Project 55 Motors</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="container" style="max-width:1000px; margin:5rem auto;">
    <h1 style="text-align:center;">Admin Dashboard</h1>
    <p style="text-align:center; margin-bottom:2rem;">This page is only accessible to authorized staff.</p>

    <div id="car-grid">
        <p style="text-align:center;">Loading cars...</p>
    </div>
</div>

<script>
async function loadAdminCars() {
    const grid = document.getElementById('car-grid');
    try {
        const response = await fetch('https://cars-api.nathan-ed2.workers.dev');
        const data = await response.json();
        const cars = data.records;

        if (cars.length === 0) {
            grid.innerHTML = '<p style="text-align:center; padding:5rem 0;">No cars in stock.</p>';
            return;
        }

        grid.innerHTML = '';
        cars.forEach((car) => {
            const f = car.fields;
            const photos = f.Photos || [];
            const mainPhoto = photos[0]?.url || 'placeholder.jpg';
            const price = f.Price ? `£${Number(f.Price).toLocaleString()} ono` : 'POA';

            const card = document.createElement('div');
            card.className = 'car-card';
            card.style = 'display:flex; align-items:center; gap:1rem; margin-bottom:1rem;';
            card.innerHTML = `
                <img src="${mainPhoto}" alt="${f.Registration}" style="width:120px; height:auto; object-fit:cover;">
                <div style="flex:1;">
                    <h2>${f.Make_Model} – ${f.Registration}</h2>
                    <p>Price: ${price} | Mileage: ${f.Mileage?.toLocaleString() || 'N/A'}</p>
                </div>
            `;
            grid.appendChild(card);
        });
    } catch (err) {
        grid.innerHTML = '<p style="text-align:center; color:red;">Failed to load data</p>';
    }
}

document.addEventListener('DOMContentLoaded', loadAdminCars);
</script>

</body>
</html>
