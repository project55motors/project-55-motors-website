<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Admin Dashboard – Project 55 Motors</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="styles.css" />
</head>

<body>

<header class="admin-header">
  <img src="logo.png" alt="Project 55 Motors" class="logo" />
  <div class="admin-actions">
    <button id="btn-hide-inactive">Hide Sold / Hidden</button>
    <button id="btn-refresh">Refresh</button>
    <button id="btn-logout" class="danger">Log Out</button>
  </div>
</header>

<div id="admin-status" class="admin-status"></div>

<main class="admin-container">
  <section class="admin-card">
    <div class="card-header">
      <h2>Stock Overview</h2>
      <button id="btn-add-vehicle">+ Add Vehicle</button>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Photo</th>
            <th>Make & Model</th>
            <th>Reg</th>
            <th>Price (£)</th>
            <th>Mileage</th>
            <th>MOT Date</th>
            <th>Engine</th>
            <th>Fuel</th>
            <th>Transmission</th>
            <th>Status</th>
            <th>Short Description</th>
            <th>Full Description</th>
            <th>Sort</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="admin-table-body">
          <!-- Rows injected by worker -->
        </tbody>
      </table>
    </div>
  </section>
</main>

<!-- LOGIN MODAL -->
<div id="login-modal" class="modal">
  <form id="login-form" class="login-card">
    <h3>Staff Login</h3>
    <p id="login-message" class="login-message"></p>

    <label>
      Username
      <input id="login-username" autocomplete="username" />
    </label>

    <label>
      Password
      <input id="login-password" type="password" autocomplete="current-password" />
    </label>

    <button type="submit">Log In</button>
  </form>
</div>

<script src="admin-dashboard.js"></script>
</body>
</html>
