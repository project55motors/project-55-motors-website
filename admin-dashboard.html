<script>
const WORKER = "https://project55motors.co.uk/api";
const TABLE = document.getElementById('admin-table-body');
const STATUS = document.getElementById('status');

let loadedOnce = false;

/* ✅ TRIPLE CLICK LOGO */
let clickCount = 0;
document.querySelector('.logo').addEventListener('click', () => {
  clickCount++;
  setTimeout(() => clickCount = 0, 600);
  if (clickCount === 3) {
    window.location.href = "/admin.html";
  }
});

/* ✅ STATUS MESSAGE */
function flash(msg, good=true){
  STATUS.style.display = "block";
  STATUS.className = good ? 'ok' : 'error';
  STATUS.textContent = msg;
  setTimeout(()=>STATUS.style.display='none',3000);
}

/* ✅ LOAD CARS (ONLY ONCE) */
async function loadCars() {

  if (loadedOnce) return;
  loadedOnce = true;

  try{
    const res = await fetch(`${WORKER}/admin/all`, {
      credentials: "include"
    });

    if(!res.ok) throw res.status;

    const html = await res.text();
    TABLE.innerHTML = html;

    flash("Stock loaded successfully ✅");

  } catch(err){
    console.error(err);
    flash("Error loading stock - check server login", false);
    TABLE.innerHTML = `<tr><td colspan="10" style="text-align:center;color:red;padding:2rem">Unable to load data</td></tr>`;
  }
}
