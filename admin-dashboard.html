<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Dashboard – Project 55 Motors</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="/styles.css">
<style>
table { width: 100%; border-collapse: collapse; }
th, td { border: 1px solid #ccc; padding: 6px; vertical-align: top; }
th { background:#f3f3f3; text-align:left; }
.admin-thumb { width:90px; height:auto; }
</style>
</head>
<body>

<h1>PROJECT 55 MOTORS</h1>
<button onclick="logout()">LOG OUT</button>

<h2>STOCK OVERVIEW</h2>

<table id="stockTable">
<thead>
<tr>
  <th>Photo</th>
  <th>Make / Model</th>
  <th>Registration</th>
  <th>Price</th>
  <th>Mileage</th>
  <th>MOT Date</th>
  <th>Engine</th>
  <th>Fuel</th>
  <th>Transmission</th>
  <th>Status</th>
  <th>Short Description</th>
  <th>Full Description</th>
  <th>Order / Actions</th>
</tr>
</thead>
<tbody id="stockBody">
</tbody>
</table>

<script src="/admin-dashboard.js"></script>
</body>
</html>
