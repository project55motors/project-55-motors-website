<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin – Project 55 Motors</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

<header>
    <img src="logo.png" class="logo" alt="Project 55 Motors">
    <nav>
        <button class="btn" id="new-vehicle-btn">New Vehicle</button>
        <button class="btn" id="dark-mode-btn">Dark Mode</button>
        <button class="btn-red" id="logout-btn">Log Out</button>
    </nav>
</header>

<div class="admin-shell">

    <!-- Tabs -->
    <div style="display:flex;gap:20px;margin-bottom:20px;">
        <button class="btn" onclick="showTab('stock')">Stock</button>
        <button class="btn" onclick="showTab('traffic')">Traffic</button>
    </div>

    <!-- STOCK TAB -->
    <div id="tab-stock" class="admin-panel">
        <table class="admin-table">
            <thead id="admin-table-head"></thead>
            <tbody id="admin-table-body"></tbody>
        </table>
    </div>

    <!-- TRAFFIC TAB -->
    <div id="tab-traffic" class="admin-panel" style="display:none;">
        <div id="traffic-summary"></div>
        <canvas id="traffic-chart" width="900" height="260"></canvas>

        <table class="admin-table" style="margin-top:30px;">
            <thead>
                <tr>
                    <th>Time</th>
                    <th>Path</th>
                    <th>Referrer</th>
                    <th>Country</th>
                    <th>User Agent</th>
                </tr>
            </thead>
            <tbody id="traffic-table-body"></tbody>
        </table>
    </div>

</div>

<script src="admin-dashboard.js"></script>
<script src="admin-traffic.js"></script>

<script>
function showTab(tab) {
    document.getElementById("tab-stock").style.display = tab === "stock" ? "block" : "none";
    document.getElementById("tab-traffic").style.display = tab === "traffic" ? "block" : "none";
}
</script>

</body>
</html>
