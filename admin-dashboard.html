<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard – Project 55 Motors</title>

<style>
    body {
        font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #f3f4f6;
        color: #111827;
    }

    .container {
        max-width: 1300px;
        margin: 3rem auto;
        padding: 2.5rem;
        background: #ffffff;
        border-radius: 18px;
        box-shadow: 0 20px 40px rgba(15, 23, 42, 0.10);
    }

    h1 {
        font-size: 2rem;
        margin-bottom: 0.25rem;
        font-weight: 700;
    }

    p.sub {
        color: #6b7280;
        margin-bottom: 1.75rem;
        font-size: 0.95rem;
    }

    .btn {
        border: none;
        border-radius: 999px;
        padding: 0.8rem 1.8rem;
        cursor: pointer;
        font-size: 0.95rem;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        margin-right: 0.75rem;
        transition: background 0.15s ease, transform 0.1s ease,
                    box-shadow 0.15s ease;
    }

    .btn:hover {
        transform: translateY(-1px);
        box-shadow: 0 8px 18px rgba(0, 0, 0, 0.15);
    }

    .btn-add    { background: #1d4ed8; color: #ffffff; }
    .btn-save   { background: #10b981; color: #ffffff; }
    .btn-sold   { background: #6b7280; color: #ffffff; }
    .btn-logout { background: #dc2626; color: #ffffff; }

    #status {
        padding: 0.75rem 1rem;
        margin: 1.25rem 0 1.5rem;
        font-weight: 600;
        border-radius: 10px;
        font-size: 0.9rem;
    }

    .ok {
        color: #047857;
        background: #ecfdf5;
    }

    .error {
        color: #b91c1c;
        background: #fef2f2;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 0.5rem;
        font-size: 0.9rem;
    }

    thead {
        background: #f3f4f6;
    }

    th, td {
        padding: 0.75rem 0.75rem;
        border-bottom: 1px solid #e5e7eb;
        vertical-align: top;
        text-align: left;
    }

    th {
        font-weight: 600;
        color: #374151;
        white-space: nowrap;
    }

    tr:nth-child(even) td {
        background: #f9fafb;
    }

    img.photo-thumb {
        width: 100px;
        height: 70px;
        object-fit: cover;
        border-radius: 8px;
    }

    input[type="number"],
    input[type="text"],
    input[type="date"],
    select,
    textarea {
        width: 100%;
        padding: 0.55rem 0.6rem;
        border-radius: 8px;
        border: 1px solid #d1d5db;
        font: inherit;
        background: #ffffff;
        resize: vertical;
    }

    textarea[name="Short_Description"] {
        min-height: 70px;
    }

    textarea[name="Full_Description"] {
        min-height: 120px;
    }

    td:last-child {
        white-space: nowrap;
    }

    td:last-child .btn {
        display: inline-block;
        margin-bottom: 0.25rem;
        width: 100%;
        text-align: center;
    }

    @media (max-width: 900px) {
        .container {
            padding: 1.5rem 1rem;
            margin: 1.5rem 0.5rem;
            border-radius: 12px;
        }

        table, thead, tbody, th, td, tr {
            font-size: 0.82rem;
        }

        img.photo-thumb {
            width: 80px;
            height: 55px;
        }
    }
</style>

</head>
<body>

<div class="container">
    <h1>Admin Dashboard</h1>
    <p class="sub">Manage your vehicle stock below.</p>

    <button class="btn btn-add" onclick="createNew()">Add Vehicle</button>
    <button class="btn btn-logout" onclick="logout()">Logout</button>

    <div id="status"></div>

    <table>
        <thead>
            <tr>
                <th>Photo</th>
                <th>Make / Model</th>
                <th>Reg</th>
                <th>Price</th>
                <th>Mileage</th>
                <th>MOT</th>
                <th>Status</th>
                <th>Short Desc</th>
                <th>Full Desc</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="car-table-body">
            <!-- Row HTML inserted by worker response -->
        </tbody>
    </table>
</div>

<script>
// FETCH ALL CARS ON LOAD
document.addEventListener("DOMContentLoaded", () => loadAdminTable());

async function loadAdminTable() {
    const body = document.getElementById("car-table-body");
    body.innerHTML = "Loading…";

    const res = await fetch("https://project55motors.co.uk/api/admin/all", { credentials: "include" });
    const html = await res.text();

    body.innerHTML = html;
}

// SAVE BUTTON
async function save(id) {
    const row = document.querySelector(`tr[data-id="${id}"]`);
    const fields = Object.fromEntries(
        [...row.querySelectorAll("input, select, textarea")].map(el => [el.name, el.value])
    );

    const res = await fetch("https://project55motors.co.uk/api/admin/update", {
        method: "POST",
        credentials: "include",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id, fields })
    });

    showStatus(res.ok ? "Saved successfully." : "Save failed.", res.ok);
}

// MARK SOLD
async function sold(id) {
    const res = await fetch("https://project55motors.co.uk/api/admin/update", {
        method: "POST",
        credentials: "include",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id, fields: { Status: "Sold" } })
    });

    showStatus(res.ok ? "Marked as Sold." : "Failed.", res.ok);
    loadAdminTable();
}

// CREATE NEW VEHICLE
async function createNew() {
    const res = await fetch("https://project55motors.co.uk/api/admin/create", {
        method: "POST",
        credentials: "include"
    });

    showStatus(res.ok ? "Vehicle created." : "Error creating vehicle.", res.ok);
    loadAdminTable();
}

// LOGOUT
async function logout() {
    await fetch("https://project55motors.co.uk/api/logout", {
        method: "POST",
        credentials: "include"
    });
    window.location.href = "index.html";
}

// STATUS BOX
function showStatus(msg, ok) {
    const box = document.getElementById("status");
    box.textContent = msg;
    box.className = ok ? "ok" : "error";
}
</script>

</body>
</html>
