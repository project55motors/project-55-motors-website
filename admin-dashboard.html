<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin • Project 55 Motors</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>

  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background:#f9fafb; }
    .container { max-width: 1480px; margin:4rem auto; padding:2rem; }
    h1 { font-size:2.5rem; text-align:center; margin-bottom:1rem; }
    table { width:100%; border-collapse:collapse; background:white; border-radius:12px; overflow:hidden; box-shadow:0 10px 30px rgba(0,0,0,0.1); }
    th { background:#1e40af; color:white; padding:1rem; text-align:left; font-weight:600; }
    td { padding:0.8rem 1rem; border-bottom:1px solid #e5e7eb; vertical-align:middle; }
    tr:hover { background:#f8fafc; }
    input, textarea, select { width:100%; padding:0.5rem; border:1px solid #d1d5db; border-radius:6px; font:inherit; }
    textarea { min-height:80px; resize:vertical; }
    .btn { padding:0.5rem 1rem; margin:0 0.3rem; border:none; border-radius:6px; cursor:pointer; font-weight:600; }
    .btn-save { background:#10b981; color:white; }
    .btn-sold { background:#6b7280; color:white; }
    .btn-add { background:#1d4ed8; color:white; padding:0.8rem 2rem; font-size:1.1rem; }
    .photo-thumb { width:90px; height:60px; object-fit:cover; border-radius:6px; }
    #status { padding:1rem; text-align:center; font-weight:600; color:#059669; background:#ecfdf5; border-radius:8px; margin:1rem 0; }
  </style>
</head>
<body>

<div class="container">
  <h1>Project 55 Motors • Admin Dashboard</h1>
  <p style="text-align:center; color:#6b7280; margin-bottom:2rem;">Full inline editing • Never open Airtable again</p>

  <div style="text-align:center; margin-bottom:2rem;">
    <button class="btn btn-add"
            hx-post="https://api.project55motors.co.uk/admin/create"
            hx-target="#cars-table tbody"
            hx-swap="beforeend"
            hx-credentials="include"
            hx-on::after-request="this.closest('.container').querySelector('#status').textContent='New car added!'; setTimeout(()=>this.closest('.container').querySelector('#status').textContent='',3000)">
      Add New Car
    </button>
  </div>

  <div id="status">Loading stock...</div>

  <table id="cars-table" x-data="admin()">
    <thead>
      <tr>
        <th>Photo</th>
        <th>Make / Model</th>
        <th>Reg</th>
        <th>Price (£)</th>
        <th>Mileage</th>
        <th>MOT Date</th>
        <th>Status</th>
        <th>Short Desc</th>
        <th width="35%">Full Description</th>
        <th>Actions</th>
      </tr>
    </thead>

    <tbody
      id="admin-table-body"
      hx-get="https://api.project55motors.co.uk/admin/all"
      hx-trigger="manual"
      hx-credentials="include"
      hx-swap="innerHTML">

      <tr>
        <td colspan="10" style="text-align:center; padding:4rem;">
          Loading your full stock (including Sold)...
        </td>
      </tr>

    </tbody>
  </table>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
  const tbody = document.getElementById("admin-table-body");
  console.log("Forcing HTMX manual load");

  if (window.htmx && tbody) {
    htmx.trigger(tbody, "manual");
  }
});
</script>

<script>
function admin() {
  return {

    save(id) {
      const row = document.querySelector(`tr[data-id="${id}"]`);
      const data = {
        id,
        fields: {
          Make_Model: row.querySelector('[name="Make_Model"]').value,
          Registration: row.querySelector('[name="Registration"]').value,
          Price: parseInt(row.querySelector('[name="Price"]').value) || 0,
          Mileage: parseInt(row.querySelector('[name="Mileage"]').value) || 0,
          MOT_Date: row.querySelector('[name="MOT_Date"]').value,
          Status: row.querySelector('[name="Status"]').value,
          Short_Description: row.querySelector('[name="Short_Description"]').value,
          Full_Description: row.querySelector('[name="Full_Description"]').value
        }
      };

      fetch("https://api.project55motors.co.uk/admin/update", {
        method: "POST",
        credentials: "include",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data)
      })
      .then(() => {
        document.getElementById("status").textContent = "Saved instantly!";
        setTimeout(() => document.getElementById("status").textContent = "", 2500);
      });
    },

    sold(id) {
      if (!confirm("Mark this car as Sold?")) return;

      fetch("https://api.project55motors.co.uk/admin/update", {
        method: "POST",
        credentials: "include",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id, fields: { Status: "Sold" } })
      })
      .then(() => location.reload());
    }

  }
}
</script>

</body>
</html>
