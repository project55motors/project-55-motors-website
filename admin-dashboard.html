<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Project 55 Motors • Admin Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="styles.css">
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>

  <style>
    body {
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
      background:#f9fafb;
    }

    .container {
      max-width:1480px;
      margin:4rem auto;
      padding:2rem;
      text-align:center;
    }

    h1 { font-size:2.5rem; margin-bottom:0.5rem; }

    p.sub { color:#6b7280; margin-bottom:2rem; }

    table {
      width:100%;
      border-collapse:collapse;
      background:white;
      border-radius:12px;
      overflow:hidden;
      box-shadow:0 10px 30px rgba(0,0,0,0.08);
    }

    th {
      background:#1e40af;
      color:white;
      padding:1rem;
      text-align:left;
      font-weight:600;
    }

    td {
      padding:0.8rem 1rem;
      border-bottom:1px solid #e5e7eb;
      vertical-align:middle;
    }

    tr:hover { background:#f8fafc; }

    input, textarea, select {
      width:100%;
      padding:0.45rem;
      border:1px solid #d1d5db;
      border-radius:6px;
      font:inherit;
    }

    textarea {
      min-height:70px;
      resize:vertical;
    }

    .btn {
      padding:0.45rem 1rem;
      border:none;
      border-radius:6px;
      cursor:pointer;
      font-weight:600;
    }

    .btn-save { background:#10b981; color:white; }
    .btn-sold { background:#6b7280; color:white; }

    .btn-add {
      background:#1d4ed8;
      color:white;
      padding:0.8rem 2rem;
      font-size:1.1rem;
      margin-bottom:1rem;
    }

    .photo-thumb {
      width:90px;
      height:60px;
      object-fit:cover;
      border-radius:6px;
    }

    #status {
      padding:1rem;
      text-align:center;
      font-weight:600;
      border-radius:8px;
      margin:1rem 0 2rem;
    }

    .ok { color:#047857; background:#ecfdf5; }
    .error { color:#b91c1c; background:#fef2f2; }

  </style>
</head>
<body>

<div class="container">
  <h1>Project 55 Motors • Admin Dashboard</h1>
  <p class="sub">Full inline editing • Never open Airtable again</p>

  <button class="btn btn-add"
          hx-post="https://admin-worker.nathan-ed2.workers.dev/admin/create"
          hx-target="#admin-table-body"
          hx-swap="beforeend"
          hx-on::after-request="
            document.getElementById('status').className='ok';
            document.getElementById('status').textContent='New car added!';
            setTimeout(()=>document.getElementById('status').textContent='',3000)
          ">
    Add New Car
  </button>

  <div id="status"></div>

  <table x-data="admin()">
    <thead>
      <tr>
        <th>Photo</th>
        <th>Make / Model</th>
        <th>Reg</th>
        <th>Price (£)</th>
        <th>Mileage</th>
        <th>MOT Date</th>
        <th>Status</th>
        <th>Short Desc</th>
        <th width="35%">Full Description</th>
        <th>Actions</th>
      </tr>
    </thead>

    <tbody id="admin-table-body"
      hx-get="https://admin-worker.nathan-ed2.workers.dev/admin/all"
      hx-trigger="load-data, revealed"
      hx-swap="innerHTML"

      hx-on:htmx:response-error="
        document.getElementById('status').className='error';
        document.getElementById('status').textContent='Network error loading stock – retrying...';
        this.innerHTML='<tr><td colspan=10 style=&quot;padding:2rem;text-align:center;color:#b91c1c;&quot;>Reconnecting...</td></tr>';
        setTimeout(()=>this.dispatchEvent(new Event('load-data')),1500);
      "
    >

      <tr>
        <td colspan="10" style="text-align:center;padding:4rem">
          Loading your full stock (including Sold)...
        </td>
      </tr>

    </tbody>
  </table>
</div>

<script>
function admin() {
  return {
    save(id) {
      const row = document.querySelector(tr[data-id="${id}"]);
      const data = {
        id,
        fields: {
          Make_Model: row.querySelector('[name="Make_Model"]').value.trim(),
          Registration: row.querySelector('[name="Registration"]').value.trim(),
          Price: parseInt(row.querySelector('[name="Price"]').value) || 0,
          Mileage: parseInt(row.querySelector('[name="Mileage"]').value) || 0,
          MOT_Date: row.querySelector('[name="MOT_Date"]').value,
          Status: row.querySelector('[name="Status"]').value,
          Short_Description: row.querySelector('[name="Short_Description"]').value.trim(),
          Full_Description: row.querySelector('[name="Full_Description"]').value.trim()
        }
      };

      fetch('https://admin-worker.nathan-ed2.workers.dev/admin/update', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      }).then(() => {
        const s = document.getElementById('status');
        s.className='ok';
        s.textContent='Saved successfully';
        setTimeout(()=>s.textContent='',2500);
      });
    },

    sold(id) {
      if (!confirm('Mark this car as SOLD? It will vanish from public site.')) return;
      fetch('https://admin-worker.nathan-ed2.workers.dev/admin/update', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id, fields: { Status: "Sold" } })
      }).then(() => location.reload());
    }
  }
}
</script>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const tbody = document.getElementById('admin-table-body');

  setTimeout(() => {
    tbody.dispatchEvent(new Event('load-data'));
  }, 300);
});
</script>

</body>
</html>
