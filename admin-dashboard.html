<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin • Project 55 Motors</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="styles.css">

  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background:#f9fafb; }
    .container { max-width: 1480px; margin:4rem auto; padding:2rem; }
    h1 { font-size:2.5rem; text-align:center; margin-bottom:1rem; }
    table { width:100%; border-collapse:collapse; background:white; border-radius:12px; overflow:hidden; box-shadow:0 10px 30px rgba(0,0,0,0.1); }
    th { background:#1e40af; color:white; padding:1rem; text-align:left; font-weight:600; }
    td { padding:0.8rem 1rem; border-bottom:1px solid #e5e7eb; vertical-align:middle; }
    tr:hover { background:#f8fafc; }
    input, textarea, select { width:100%; padding:0.5rem; border:1px solid #d1d5db; border-radius:6px; font:inherit; }
    textarea { min-height:80px; resize:vertical; }
    .btn { padding:0.5rem 1rem; margin:0 0.3rem; border:none; border-radius:6px; cursor:pointer; font-weight:600; }
    .btn-save { background:#10b981; color:white; }
    .btn-sold { background:#6b7280; color:white; }
    .btn-add { background:#1d4ed8; color:white; padding:0.8rem 2rem; font-size:1.1rem; }
    .photo-thumb { width:90px; height:60px; object-fit:cover; border-radius:6px; }
    #status {
      padding:1rem;
      text-align:center;
      font-weight:600;
      color:#059669;
      background:#ecfdf5;
      border-radius:8px;
      margin:1rem 0;
      min-height:20px;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Project 55 Motors • Admin Dashboard</h1>
  <p style="text-align:center; color:#6b7280; margin-bottom:2rem;">
    Full inline editing • Never open Airtable again
  </p>

  <div style="text-align:center; margin-bottom:2rem;">
    <button class="btn btn-add" onclick="addNewCar()">
      Add New Car
    </button>
  </div>

  <div id="status">Loading stock…</div>

  <table id="cars-table">
    <thead>
      <tr>
        <th>Photo</th>
        <th>Make / Model</th>
        <th>Reg</th>
        <th>Price (£)</th>
        <th>Mileage</th>
        <th>MOT Date</th>
        <th>Status</th>
        <th>Short Desc</th>
        <th width="35%">Full Description</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="admin-table-body">
      <tr>
        <td colspan="10" style="text-align:center; padding:4rem;">
          Loading your full stock (including Sold)...
        </td>
      </tr>
    </tbody>
  </table>
</div>

<script>
const API_BASE = "https://api.project55motors.co.uk";

async function loadCars() {
  const statusEl = document.getElementById("status");
  const tbody = document.getElementById("admin-table-body");

  statusEl.textContent = "Loading stock…";

  try {
    const res = await fetch(`${API_BASE}/admin/all`, {
      credentials: "include"
    });

    const text = await res.text();

    if (!res.ok) {
      statusEl.textContent = text || `Error loading data (status ${res.status})`;
      console.error("Admin /admin/all error:", text);
      return;
    }

    // /admin/all returns HTML rows
    tbody.innerHTML = text;
    statusEl.textContent = "Stock loaded.";
  } catch (err) {
    statusEl.textContent = "Network error loading stock.";
    console.error("Admin loadCars error:", err);
  }
}

async function addNewCar() {
  const statusEl = document.getElementById("status");
  statusEl.textContent = "Creating blank car…";

  try {
    const res = await fetch(`${API_BASE}/admin/create`, {
      method: "POST",
      credentials: "include"
    });

    const text = await res.text();

    if (!res.ok) {
      statusEl.textContent = text || `Error creating car (status ${res.status})`;
      console.error("Admin /admin/create error:", text);
      return;
    }

    statusEl.textContent = "New car added.";
    await loadCars();
  } catch (err) {
    statusEl.textContent = "Network error creating car.";
    console.error("Admin addNewCar error:", err);
  }
}

// These must be global because your Worker’s HTML uses onclick="save('id')" etc.
async function save(id) {
  const row = document.querySelector(`tr[data-id="${id}"]`);
  const statusEl = document.getElementById("status");

  const data = {
    id,
    fields: {
      Make_Model:        row.querySelector('[name="Make_Model"]').value.trim(),
      Registration:      row.querySelector('[name="Registration"]').value.trim(),
      Price:             parseInt(row.querySelector('[name="Price"]').value) || 0,
      Mileage:           parseInt(row.querySelector('[name="Mileage"]').value) || 0,
      MOT_Date:          row.querySelector('[name="MOT_Date"]').value,
      Status:            row.querySelector('[name="Status"]').value,
      Short_Description: row.querySelector('[name="Short_Description"]').value.trim(),
      Full_Description:  row.querySelector('[name="Full_Description"]').value.trim()
    }
  };

  statusEl.textContent = "Saving…";

  try {
    const res = await fetch(`${API_BASE}/admin/update`, {
      method: "POST",
      credentials: "include",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(data)
    });

    const text = await res.text();

    if (!res.ok) {
      statusEl.textContent = text || `Error saving (status ${res.status})`;
      console.error("Admin /admin/update error:", text);
      return;
    }

    statusEl.textContent = "Saved instantly!";
    setTimeout(() => statusEl.textContent = "", 2500);
  } catch (err) {
    statusEl.textContent = "Network error saving car.";
    console.error("Admin save error:", err);
  }
}

async function sold(id) {
  const statusEl = document.getElementById("status");
  if (!confirm("Mark this car as Sold? It will disappear from the public site.")) return;

  statusEl.textContent = "Marking as Sold…";

  try {
    const res = await fetch(`${API_BASE}/admin/update`, {
      method: "POST",
      credentials: "include",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id, fields: { Status: "Sold" } })
    });

    const text = await res.text();

    if (!res.ok) {
      statusEl.textContent = text || `Error marking sold (status ${res.status})`;
      console.error("Admin sold error:", text);
      return;
    }

    await loadCars();
  } catch (err) {
    statusEl.textContent = "Network error marking Sold.";
    console.error("Admin sold error:", err);
  }
}

// Load on page ready
document.addEventListener("DOMContentLoaded", loadCars);
</script>

</body>
</html>
