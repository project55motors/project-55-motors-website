<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Project 55 Motors – Admin Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="/styles.css" />
  <style>
    body {
      font-family: Inter, system-ui, sans-serif;
      background: #f5f7fb;
    }

    .admin-container {
      max-width: 1400px;
      margin: 5rem auto;
      padding: 2rem;
    }

    h1 { margin-bottom: 0.3rem; }
    .sub { color: #666; margin-bottom: 2rem; }

    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.2rem;
    }

    button {
      padding: 10px 16px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .btn-primary { background: #2563eb; color: white; }
    .btn-save { background: #10b981; color: white; margin-bottom: 0.4rem; }
    .btn-sold { background: #6b7280; color: white; }

    .message {
      padding: 12px 15px;
      border-radius: 8px;
      margin: 1rem 0;
      display: none;
    }

    .error { background: #fee2e2; color:#991b1b; display:block;}
    .success { background:#dcfce7; color:#166534; display:block;}

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 6px 15px rgba(0,0,0,0.03);
    }

    th {
      background:#1e40af;
      color:white;
      font-weight:600;
      padding:12px 8px;
      font-size:14px;
    }

    td { padding:10px; vertical-align:top; }

    input, textarea, select {
      width:100%;
      padding:7px;
      border-radius:6px;
      border:1px solid #cbd5e1;
      font-size:0.85rem;
    }

    textarea { min-height: 55px; }

    img.photo-thumb {
      width:85px;
      height:60px;
      object-fit:cover;
      border-radius:6px;
      border:1px solid #ddd;
    }

    .table-wrap { overflow-x:auto; }
  </style>
</head>

<body>

  <div class="admin-container">
    <h1>Project 55 Motors · Admin Dashboard</h1>
    <p class="sub">Full inline editing · Never open Airtable again</p>

    <div class="controls">
      <button class="btn-primary" id="addBtn">Add New Car</button>
      <button class="btn-sold" onclick="logout()">Logout</button>
    </div>

    <div id="statusMsg" class="message"></div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Photo</th>
            <th>Make / Model</th>
            <th>Reg</th>
            <th>£</th>
            <th>Mileage</th>
            <th>MOT</th>
            <th>Status</th>
            <th>Short</th>
            <th>Full Description</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="stockTable">
          <tr><td colspan="10" style="text-align:center;padding:30px">Loading stock…</td></tr>
        </tbody>
      </table>
    </div>
  </div>

<script>
const API = "https://project55motors.co.uk/api"

const table = document.getElementById("stockTable")
const msg = document.getElementById("statusMsg")

function show(type, text) {
  msg.className = `message ${type}`
  msg.textContent = text
}
